<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seru Digital</title>
<meta name="description" content="Seru Digital — Studio produksi video animasi & konten sinematik berbasis AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070b;--cream:#f5f0ea;--text:#ededf0;--muted:#8a8a98;--faint:#555562;
  --surface:rgba(255,255,255,.04);--border:rgba(255,255,255,.07);
  --g1:#c4b5fd;--g2:#a78bfa;
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',var(--font);
  --maxw:1200px;--radius:20px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img,svg,video{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--g1);color:var(--bg);}

.bg-mesh{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;}
.bg-mesh div{position:absolute;border-radius:50%;filter:blur(100px);}
.bg-mesh div:nth-child(1){width:600px;height:600px;background:#7c3aed;top:-200px;left:-100px;opacity:.14;animation:drift1 18s ease-in-out infinite;}
.bg-mesh div:nth-child(2){width:400px;height:400px;background:#818cf8;bottom:-100px;right:-50px;opacity:.1;animation:drift2 22s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.12)}66%{transform:translate(-30px,20px) scale(.93)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-30px) scale(1.1)}}

.nav{position:fixed;top:12px;left:50%;z-index:100;transform:translateX(-50%);
  width:calc(100% - 40px);max-width:680px;
  background:rgba(12,12,18,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.08);border-radius:100px;padding:8px 12px;
  display:flex;align-items:center;justify-content:space-between;transition:all .4s;}
.nav.scrolled{border-color:rgba(255,255,255,.15);box-shadow:0 8px 40px rgba(0,0,0,.5);}
.nav-brand{font-family:var(--display);font-weight:700;font-size:14px;padding:6px 16px;letter-spacing:-.01em;}
.nav-links{display:flex;gap:4px;align-items:center;}
.nav-links a{font-size:12px;font-weight:500;padding:8px 16px;border-radius:100px;color:var(--muted);transition:all .25s;}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:rgba(255,255,255,.06);}
.nav-cta{margin-left:4px;padding:10px 20px;border-radius:100px;font-size:11px;font-weight:600;background:var(--text);color:var(--bg);transition:all .25s;}
.nav-cta:hover{transform:scale(1.04);box-shadow:0 8px 28px rgba(196,181,253,.25);}
@media(max-width:768px){.nav{width:calc(100% - 16px)}.nav-links a:not(.nav-cta){display:none;}}

.hero{position:relative;min-height:100vh;display:flex;align-items:center;z-index:1;}
.hero-bg{position:absolute;inset:0;overflow:hidden;}
.hero-bg video{position:absolute;top:50%;left:50%;width:177.78vh;height:56.25vw;min-width:100%;min-height:100%;transform:translate(-50%,-50%);object-fit:cover;pointer-events:none;}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 50%,rgba(124,58,237,.12),transparent 55%),
    linear-gradient(180deg,rgba(7,7,11,.1) 0%,rgba(7,7,11,.6) 55%,rgba(7,7,11,.92) 92%);}
.hero-content{position:relative;z-index:2;width:100%;max-width:var(--maxw);margin:0 auto;padding:0 32px;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border:1px solid rgba(255,255,255,.1);border-radius:100px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:28px;
  backdrop-filter:blur(8px);background:rgba(255,255,255,.03);animation:fadeUp .8s both;}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:#a78bfa;box-shadow:0 0 10px #a78bfa;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
.hero h1{font-family:var(--display);font-size:clamp(40px,7vw,82px);line-height:.98;font-weight:800;letter-spacing:-.03em;margin-bottom:22px;
  animation:fadeUp .8s .1s both;}
.hero h1 .accent{background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{font-size:clamp(15px,1.7vw,18px);color:rgba(255,255,255,.52);max-width:48ch;margin-bottom:40px;line-height:1.7;animation:fadeUp .8s .2s both;}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;animation:fadeUp .8s .3s both;}
.btn{padding:14px 30px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:none;transition:all .3s;}
.btn-fill{background:var(--text);color:var(--bg);}
.btn-fill:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(196,181,253,.3);}
.btn-outline{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.2);}
.btn-outline:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.04);}
@keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.hero{padding-top:100px;min-height:92vh;}}

.section{position:relative;z-index:1;padding:50px 32px 70px;}
.section-inner{max-width:var(--maxw);margin:0 auto;}
.section-tag{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--g2);margin-bottom:12px;}
.section-tag .dot{width:5px;height:5px;border-radius:50%;background:var(--g2);}
.section h2{font-family:var(--display);font-size:clamp(26px,4vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.06;margin-bottom:14px;}
.section-sub{color:var(--muted);font-size:16px;max-width:48ch;margin-bottom:40px;}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;transition:all .35s;}
.stat:hover{transform:translateY(-4px);border-color:rgba(196,181,253,.25);box-shadow:0 16px 40px rgba(124,58,237,.1);}
.stat-value{font-family:var(--display);font-size:clamp(28px,4vw,42px);font-weight:700;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat-label{font-weight:600;margin-top:8px;}
.stat-cap{color:var(--faint);font-size:13px;margin-top:3px;}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);}}

.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
@media(max-width:700px){.video-grid{grid-template-columns:1fr;}}
.v-card{position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;
  background:#111115;border:1px solid rgba(255,255,255,.05);transition:all .4s;}
.v-card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.15);box-shadow:0 20px 60px rgba(0,0,0,.6);}
.v-card:hover .v-play{transform:scale(1.06);opacity:1;}
.v-card:hover .v-thumb img{transform:scale(1.04);}
.v-thumb{aspect-ratio:16/9;position:relative;overflow:hidden;background:#1a1a22;}
.v-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
.v-thumb::after{content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(7,7,11,.75) 0%,transparent 30%,transparent 70%,rgba(7,7,11,.08));}
.v-play{position:absolute;inset:0;display:grid;place-items:center;z-index:2;opacity:.45;transition:all .3s;}
.v-play-icon{width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.22);display:grid;place-items:center;}
.v-play-icon::after{content:"";border-left:16px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:3px;}
.v-info{padding:18px 22px 22px;position:relative;z-index:1;}
.v-info h3{font-family:var(--display);font-size:20px;font-weight:700;margin-bottom:4px;}
.v-info .v-desc{color:var(--muted);font-size:13px;line-height:1.5;}

.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:900px){.svc-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.svc-grid{grid-template-columns:1fr}}
.svc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;transition:all .35s;}
.svc-card:hover{transform:translateY(-4px);border-color:rgba(196,181,253,.2);}
.svc-icon{font-size:28px;margin-bottom:14px;}
.svc-card h3{font-family:var(--display);font-size:17px;font-weight:700;margin-bottom:8px;}
.svc-card p{color:var(--muted);font-size:14px;line-height:1.6;}

.class-list{display:grid;gap:14px;margin-bottom:28px;}
.class-item{display:flex;gap:18px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;transition:all .35s;}
.class-item:hover{border-color:rgba(196,181,253,.2);transform:translateX(4px);}
.class-num{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;color:var(--bg);}
.class-item h3{font-size:17px;font-weight:600;margin-bottom:4px;}
.class-item p{margin:0;color:var(--muted);font-size:14px;}
.callout{display:flex;gap:16px;align-items:center;background:linear-gradient(120deg,rgba(167,139,250,.12),rgba(129,140,248,.06));border:1px solid rgba(167,139,250,.2);border-radius:var(--radius);padding:22px 26px;}
.callout .ico{font-size:28px;}
.callout strong{font-family:var(--display);font-size:16px;}
.callout p{margin:4px 0 0;color:var(--muted);font-size:14px;}
.class-cta{margin-top:22px;display:flex;justify-content:center;}
.class-cta .btn{font-size:14px;padding:16px 36px;}

.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:860px){.testi-grid{grid-template-columns:1fr}}
.testi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px 26px;position:relative;}
.testi-card::before{content:"\201C";position:absolute;top:0;left:16px;font-size:64px;font-family:Georgia,serif;color:rgba(167,139,250,.25);line-height:1;}
.testi-quote{margin:14px 0;color:#d6d6e2;font-size:15px;line-height:1.6;}
.testi-name{font-family:var(--display);font-weight:600;font-size:15px;}
.testi-meta{color:var(--faint);font-size:12px;margin-top:2px;}

.section-alt{background:var(--cream);color:#1a1a1e;}
.section-alt .section-tag{color:#6d28d9;}
.section-alt .section-tag .dot{background:#6d28d9;}
.section-alt h2{color:#1a1a1e;}
.section-alt .section-sub{color:#555;}

.contact-card{text-align:center;padding:60px 32px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
.contact-card h2{font-family:var(--display);font-size:clamp(26px,4vw,42px);margin-bottom:12px;}
.contact-card p{color:var(--muted);margin-bottom:28px;max-width:42ch;margin:0 auto 28px;}
.contact-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

footer{padding:36px 32px;text-align:center;color:var(--faint);font-size:13px;border-top:1px solid var(--border);position:relative;z-index:1;}
footer span{color:var(--g2);}

.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);backdrop-filter:blur(12px);align-items:center;justify-content:center;}
.modal.open{display:flex;}
.modal-close{position:absolute;top:28px;right:28px;z-index:201;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center;transition:all .2s;}
.modal-close:hover{background:rgba(255,255,255,.1);}
.modal-video{width:min(92vw,1100px);aspect-ratio:16/9;position:relative;}
.modal-video iframe{width:100%;height:100%;border:0;border-radius:16px;}

.reveal{opacity:0;transform:translateY(36px);transition:opacity .7s,transform .7s;}
.reveal.in{opacity:1;transform:translateY(0);}
@media(prefers-reduced-motion){.reveal{opacity:1;transform:none}}
</style></head><body>
<div class="bg-mesh"><div></div><div></div></div>
<div id="app"></div>
<script>
(function(){
let E=(s)=>{let d=document.createElement('span');d.textContent=(s??"");return d.innerHTML;};
let ytId=(u)=>{let m=String(u??"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);return m?m[1]:u;};
let thumb=(id)=>'https://img.youtube.com/vi/'+id+'/hqdefault.jpg';
let nl2p=(t)=>String(t??"").split(/\n{2,}|\n/).filter(x=>x.trim()).map(p=>'<p>'+E(p)+'</p>').join('');

function sec(id,tag,title,sub,inner,alt){
  let cls=alt?'section section-alt reveal':'section reveal';
  return `<section id="${id}" class="${cls}"><div class="section-inner"><span class="section-tag"><span class="dot"></span>${E(tag)}</span><h2>${E(title)}</h2><p class="section-sub">${E(sub)}</p>${inner}</div></section>`;
}

function render(){
  let D=window.SD||{};
  let brand=D.brand||"Seru Digital";
  let hvid=D.heroVideo||"/mascot.mp4";

  let nav=`<nav class="nav" id="topNav"><span class="nav-brand">${E(brand)}</span><div class="nav-links"><a href="#layanan">Layanan</a><a href="#kelas">Kelas</a><a href="#karya">Karya</a><a href="#testimoni">Testimoni</a><a href="#kontak" class="nav-cta">Mulai Project</a></div></nav>`;

  let heroBg=`<div class="hero-bg"><video autoplay muted loop playsinline preload="auto" src="${E(hvid)}"></video></div>`;

  let hero=`<section class="hero">${heroBg}<div class="hero-content">
    <span class="hero-badge"><span class="dot"></span>${E(D.heroEyebrow||'Kreator & Mentor Video Animasi AI')}</span>
    <h1><span class="accent">${E(D.heroTitle||'Mengubah ide jadi cerita visual yang hidup.')}</span></h1>
    <p class="hero-sub">${E(D.heroText||'')}</p>
    <div class="hero-btns"><a class="btn btn-fill" href="#karya">Lihat Karya</a><a class="btn btn-outline" href="#kontak">Ajak Kolaborasi</a></div>
  </div></section>`;

  let statsHtml='<div class="stats">'+(D.stats||[]).map(s=>`<div class="stat"><div class="stat-value">${E(s.value)}</div><div class="stat-label">${E(s.label)}</div><div class="stat-cap">${E(s.caption)}</div></div>`).join('')+'</div>';
  let statsSec=sec('stats','Seru Digital dalam angka','Mengapa memilih kami','',statsHtml);
  statsSec=statsSec.replace('class="section','class="section').replace('class="section section-alt','class="section');//no tag/sub for stats

  let aboutSec=sec('tentang',D.aboutTitle||'Tentang Seru Digital','','','<div style="font-size:17px;color:#c7c7d4;line-height:1.8">'+nl2p(D.aboutText)+'</div>');

  let vidHtml='<div class="video-grid">'+(D.videos||[]).map(v=>{
    let id=ytId(v.youtube),img=id?thumb(id):'';
    return `<article class="v-card" data-video="${E(v.youtube)}"><div class="v-thumb">${img?`<img src="${E(img)}" alt="${E(v.title)}" loading="lazy">`:''}<div class="v-play"><div class="v-play-icon"></div></div></div><div class="v-info"><h3>${E(v.title)}</h3><div class="v-desc">${E(v.desc)}</div></div></article>`;
  }).join('')+'</div>';
  let vidSec=sec('karya','Portfolio','Karya pilihan','Beberapa video yang sudah saya produksi — dari sinematik sampai konten iklan.',vidHtml);

  let svcHtml='<div class="svc-grid">'+(D.services||[]).map(s=>`<div class="svc-card"><div class="svc-icon">${E(s.icon)}</div><h3>${E(s.title)}</h3><p>${E(s.desc)}</p></div>`).join('')+'</div>';
  let svcSec=sec('layanan','Layanan','Apa yang bisa saya bantu','Solusi konten video & animasi untuk brand dan kreator.',svcHtml,'alt');

  let classHtml='<div class="class-list">'+(D.classItems||[]).map((c,i)=>`<div class="class-item"><div class="class-num">${i+1}</div><div><h3>${E(c.title)}</h3><p>${E(c.desc)}</p></div></div>`).join('')+
    '</div><div class="callout"><div class="ico">🎓</div><div><strong>SERU DIGITAL LABS</strong><p>Ekosistem belajar berisi materi, tools SERA, dan komunitas untuk membantu kamu menguasai produksi video animasi AI.</p></div></div>'+
    '<div class="class-cta"><a class="btn btn-fill" href="'+(D.whatsapp||'#kontak')+'" target="_blank">🚀 Gabung Sekarang</a></div>';
  let classSec=sec('kelas','Belajar',D.classTitle||'Belajar bareng Seru Digital',D.classText||'',classHtml);

  let testiHtml='<div class="testi-grid">'+(D.testimonials||[]).map(t=>`<div class="testi-card"><p class="testi-quote">${E(t.quote)}</p><div class="testi-name">${E(t.name)}</div><div class="testi-meta">${E(t.meta)}</div></div>`).join('')+'</div>';
  let testiSec=sec('testimoni','Testimoni','Apa kata klien & murid','',testiHtml,'alt');

  let contactBtns='<a class="btn btn-fill" href="mailto:'+E(D.email)+'">✉️ Email Saya</a>'+
    (D.whatsapp?'<a class="btn btn-outline" href="'+E(D.whatsapp)+'" target="_blank">💬 WhatsApp</a>':'')+
    (D.instagram?'<a class="btn btn-outline" href="'+E(D.instagram)+'" target="_blank">Instagram</a>':'');
  let contactSec=sec('kontak','Kontak',D.contactTitle||'Ayo kerja bareng',D.contactText||'','<div class="contact-card">'+contactBtns+'</div>');

  let footer=`<footer>${E(brand)} <span>✦</span> SERU DIGITAL LABS <span>✦</span> 2026</footer>`;
  let modal=`<div class="modal" id="videoModal"><button class="modal-close" id="modalClose">&times;</button><div class="modal-video"><iframe id="modalIframe" src="" allow="autoplay;encrypted-media" allowfullscreen></iframe></div></div>`;

  document.getElementById("app").innerHTML=nav+hero+statsSec+aboutSec+svcSec+classSec+vidSec+testiSec+contactSec+footer+modal;
  initApp();
}

function initApp(){
  window.addEventListener("scroll",()=>document.getElementById("topNav").classList.toggle("scrolled",scrollY>60));
  document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener("click",function(e){
    e.preventDefault();let t=document.querySelector(this.getAttribute("href"));if(t)t.scrollIntoView({behavior:"smooth"});
  }));
  let modal=document.getElementById("videoModal"),iframe=document.getElementById("modalIframe");
  document.querySelectorAll(".v-card").forEach(c=>c.addEventListener("click",()=>{
    let vid=c.dataset.video,id=ytId(vid);if(!id)return;
    iframe.src="https://www.youtube.com/embed/"+id+"?autoplay=1&rel=0";modal.classList.add("open");document.body.style.overflow="hidden";
  }));
  let close=()=>{modal.classList.remove("open");iframe.src="";document.body.style.overflow="";};
  document.getElementById("modalClose").addEventListener("click",close);
  modal.addEventListener("click",e=>{if(e.target===modal)close()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  let obs=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");obs.unobserve(e.target);}})},{threshold:.1,rootMargin:"0px 0px -30px 0px"});
  document.querySelectorAll(".reveal").forEach(el=>obs.observe(el));
}
window.SD={};

fetch("data/content.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{window.SD=j||{};render();}).catch(()=>render());
})();
</script></body></html>
