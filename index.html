<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seru Digital</title>
<meta name="description" content="Seru Digital — Studio produksi video animasi & konten sinematik berbasis AI. Juga mentor kelas AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050508;--s1:#0a0a10;--s2:#0f0f18;--s3:#151520;
  --t1:#f2f2f7;--t2:#a0a0b8;--t3:#5c5c72;
  --b1:rgba(255,255,255,.06);--b2:rgba(255,255,255,.10);--b3:rgba(255,255,255,.14);
  --accent:#4facfe;--accent2:#00d4ff;--glow:rgba(79,172,254,.14);
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --maxw:1200px;--radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--t1);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:-30%;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 14% 12%,rgba(0,210,255,.18),transparent 42%),
    radial-gradient(ellipse at 82% 18%,rgba(58,123,213,.15),transparent 38%),
    radial-gradient(ellipse at 56% 78%,rgba(14,116,144,.12),transparent 34%),
    radial-gradient(ellipse at 88% 86%,rgba(0,119,182,.10),transparent 30%);
  animation:aurora 26s ease-in-out infinite alternate;}
@keyframes aurora{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-22px) scale(1.08)}}

/* Subtle dot grid */
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.03;
  background-image:radial-gradient(rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:32px 32px;}

/* Custom cursor */
.cursor{position:fixed;width:24px;height:24px;border-radius:50%;pointer-events:none;z-index:9999;
  border:1.5px solid rgba(79,172,254,.5);transform:translate(-50%,-50%);
  transition:width .2s,height .2s,border-color .2s;mix-blend-mode:screen;}
.cursor-dot{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:9999;
  background:var(--accent);transform:translate(-50%,-50%);box-shadow:0 0 12px var(--accent);}
.cursor.hover{width:48px;height:48px;border-color:var(--accent);background:rgba(79,172,254,.08);}
@media(max-width:768px),(pointer:coarse){.cursor,.cursor-dot{display:none;}}
img,svg,video{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--accent);color:#fff;}

.nav{position:fixed;top:16px;left:0;right:0;z-index:100;padding:0 18px;background:transparent;}
.nav-inner{max-width:1180px;margin:0 auto;padding:9px 12px 9px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid rgba(255,255,255,.06);border-radius:22px;background:rgba(8,10,18,.58);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 36px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.035);}
.nav-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:-.02em;color:rgba(255,255,255,.97);}
.nav-brand::before{content:"";width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 0 16px rgba(0,210,255,.28);}
.nav-menu{display:flex;gap:4px;align-items:center;}
.nav-menu a{font-size:11.5px;font-weight:500;padding:9px 12px;border-radius:999px;color:rgba(242,242,247,.62);transition:all .2s ease;}
.nav-menu a:hover{color:var(--t1);background:rgba(255,255,255,.035);}
.nav-wa{width:38px;height:38px;padding:0 !important;border-radius:999px !important;display:grid !important;place-items:center;border:1px solid rgba(37,211,102,.14);background:rgba(37,211,102,.05);color:#9cf1bc !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);font-size:15px !important;}
.nav-wa:hover{transform:translateY(-1px);background:rgba(37,211,102,.09) !important;border-color:rgba(37,211,102,.22);color:#dcffe8 !important;box-shadow:none;}
.nav-cta{padding:10px 16px !important;border-radius:13px !important;font-size:11.5px !important;font-weight:600 !important;background:linear-gradient(135deg,rgba(0,210,255,.92),rgba(58,123,213,.92));color:#f7fcff!important;box-shadow:0 12px 28px rgba(0,85,170,.24), inset 0 1px 0 rgba(255,255,255,.18);}
.nav-cta:hover{transform:translateY(-1px);box-shadow:0 16px 30px rgba(0,85,170,.28), inset 0 1px 0 rgba(255,255,255,.22);filter:saturate(1.05);}
@media(max-width:768px){.nav-menu a:not(.nav-cta):not(.nav-wa){display:none;}.nav-inner{padding:8px 12px 8px 16px;}}

.hero{position:relative;min-height:92vh;display:flex;align-items:center;overflow:hidden;padding-top:82px;}
.hero-bg{position:absolute;inset:0;}
.hero-bg video{position:absolute;top:50%;left:50%;width:177.78vh;height:56.25vw;min-width:100%;min-height:100%;transform:translate(-50%,-50%);object-fit:cover;filter:brightness(.56) saturate(.84);}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 22% 38%,rgba(0,210,255,.14),transparent 32%),
    radial-gradient(ellipse at 78% 34%,rgba(79,172,254,.16),transparent 26%),
    radial-gradient(circle at 78% 40%,rgba(0,210,255,.10),transparent 18%),
    linear-gradient(90deg,rgba(5,5,8,.12) 0%,rgba(5,5,8,.36) 32%,rgba(5,5,8,.68) 58%,rgba(5,5,8,.88) 100%),
    linear-gradient(180deg,rgba(5,5,8,.12),rgba(5,5,8,.58) 62%,var(--bg) 92%);}
.hero-content{position:relative;z-index:2;width:100%;max-width:var(--maxw);margin:0 auto;padding:0 32px;display:block;}
.hero-copy{max-width:690px;}
.hero-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 16px;border:1px solid rgba(255,255,255,.12);border-radius:100px;
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#dcf6ff;margin-bottom:24px;
  backdrop-filter:blur(8px);background:rgba(255,255,255,.04);animation:fadeUp .7s both;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);}
.hero-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.hero h1{font-size:clamp(50px,7.4vw,94px);line-height:.9;font-weight:900;letter-spacing:-.065em;margin-bottom:22px;max-width:9.6ch;animation:fadeUp .7s .1s both;text-wrap:balance;}
.hero h1 em{font-style:normal;color:var(--accent);}
.hero-sub{font-size:clamp(14px,1.45vw,17px);color:rgba(242,242,247,.78);max-width:33ch;margin-bottom:30px;line-height:1.75;animation:fadeUp .7s .2s both;}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap;animation:fadeUp .7s .3s both;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .25s;}
.btn-fill{background:linear-gradient(135deg,#f4f7ff,#dce8ff);color:#050508;box-shadow:0 12px 28px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.74);}
.btn-fill:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.84);}
.btn-line{background:rgba(255,255,255,.02);color:var(--t1);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);}
.btn-line:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.05);}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.hero{padding-top:100px;min-height:90vh;}.hero-content{padding:0 20px;}.hero-copy{max-width:none}}

.marquee-bar{background:linear-gradient(90deg,rgba(0,210,255,.06),rgba(0,180,255,.1),rgba(0,210,255,.06));border-bottom:1px solid rgba(0,210,255,.12);padding:8px 0;overflow:hidden;white-space:nowrap;position:relative;z-index:40;}
.marquee-inner{display:inline-flex;animation:scroll 20s linear infinite;gap:0;}
.marquee-inner span{color:rgba(0,210,255,.85);font-size:12.5px;font-weight:600;letter-spacing:.03em;padding:0 24px;}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-33.33%)}}

.section{padding:68px 0;position:relative;}
.section-inner{max-width:var(--maxw);margin:0 auto;padding:0 32px;}
.label{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;}
.section h2{font-size:clamp(24px,3.3vw,38px);font-weight:800;letter-spacing:-.035em;line-height:1.08;margin-bottom:10px;max-width:18ch;}
.section p.desc{color:rgba(242,242,247,.68);font-size:14px;max-width:40ch;margin-bottom:28px;line-height:1.7;}

/* Showcase reel */
.showcase-shell{position:relative;overflow:hidden;border:1px solid var(--b1);background:radial-gradient(circle at 50% 0%,rgba(0,212,255,.10),transparent 28%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border-radius:32px;padding:28px;box-shadow:0 20px 80px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.05);}
.showcase-shell::before{content:"";position:absolute;left:50%;top:108px;transform:translateX(-50%);width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(79,172,254,.20),rgba(79,172,254,0) 70%);filter:blur(24px);pointer-events:none;}
.showcase-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:18px;}
.showcase-kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:block;}
.showcase-top h3{font-size:clamp(18px,2vw,24px);line-height:1.15;letter-spacing:-.03em;max-width:20ch;font-weight:700;}
.showcase-nav{display:flex;gap:10px;flex:none;padding-top:6px;}
.showcase-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--b1);background:rgba(255,255,255,.03);color:var(--t1);cursor:pointer;transition:all .25s;}
.showcase-btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 24px rgba(79,172,254,.18);}
.showcase-stage{position:relative;perspective:1800px;height:560px;padding:8px 0 0;overflow:hidden;user-select:none;touch-action:pan-y;cursor:grab;}
.showcase-stage.dragging{cursor:grabbing;}
.showcase-track{position:relative;height:100%;transform-style:preserve-3d;}
.showcase-caption{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-top:16px;color:var(--t2);font-size:12px;}
.showcase-caption strong{color:var(--t1);font-size:13px;display:block;margin-bottom:2px;}
.showcase-dots{display:flex;gap:8px;align-items:center;}
.showcase-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16);transition:all .25s;}
.showcase-dot.active{width:22px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 18px rgba(79,172,254,.3);}
.reel-card{position:absolute;top:0;left:50%;width:36%;height:100%;min-width:260px;border-radius:28px;overflow:hidden;border:1px solid var(--b1);background:var(--s1);cursor:pointer;transition:border-color .3s,box-shadow .45s,filter .25s;transform-style:preserve-3d;will-change:transform,opacity;}
.reel-card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.62) 72%,rgba(0,0,0,.92));z-index:1;}
.reel-card img,.reel-card .reel-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.reel-card.is-active{box-shadow:0 26px 100px rgba(0,0,0,.50),0 0 65px rgba(79,172,254,.16);border-color:rgba(79,172,254,.30);}
.reel-card:hover{border-color:rgba(79,172,254,.35);}
.showcase-stage::after{content:"Geser untuk melihat karya lain";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.34);pointer-events:none;}
.reel-play{position:absolute;top:20px;right:20px;z-index:2;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.10);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);}
.reel-play::before{content:"";display:block;margin-left:4px;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;}
.reel-meta{position:absolute;left:22px;right:22px;bottom:22px;z-index:2;}
.reel-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#dff5ff;margin-bottom:14px;}
.reel-meta h4{font-size:clamp(18px,2vw,28px);line-height:1.08;letter-spacing:-.03em;margin-bottom:8px;}
.reel-meta p{color:rgba(242,242,247,.8);font-size:13px;max-width:34ch;}
@media(max-width:980px){.showcase-stage{height:430px}.reel-card{width:62%;min-width:0}.reel-card.pos-left,.reel-card.pos-right{opacity:.22}.reel-card.pos-far-left,.reel-card.pos-far-right{display:none}.showcase-top h3{max-width:16ch}.showcase-caption{flex-direction:column;align-items:flex-start;}}
@media(max-width:640px){.showcase-shell{padding:18px}.showcase-top{align-items:center}.showcase-top h3{max-width:none;font-size:18px}.showcase-stage{height:360px}.reel-card{width:84%}.reel-card.pos-left,.reel-card.pos-right{opacity:0;pointer-events:none}.showcase-stage::after{font-size:10px;bottom:-2px}}
.section p.desc{color:var(--t2);font-size:15px;max-width:44ch;margin-bottom:36px;}

/* Premium micro-interactions */
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:0;transform:translateY(20px);transition:all .7s cubic-bezier(.16,1,.3,1);}
.reveal.visible{opacity:1;transform:translateY(0);}

.stats-wrap{margin-top:10px;position:relative;z-index:4;}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch;}

.stat{background:linear-gradient(180deg,rgba(15,18,28,.9),rgba(10,11,18,.98));border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:26px 22px;transition:all .35s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
.stat::before{content:"";position:absolute;left:0;top:0;width:100%;height:1px;background:linear-gradient(90deg,rgba(0,210,255,0),rgba(0,210,255,.45),rgba(0,210,255,0));opacity:.75;}
.stat::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--glow),transparent 70%);opacity:0;transition:opacity .4s;}
.stat:hover{transform:translateY(-4px);border-color:rgba(0,210,255,.24);box-shadow:0 18px 50px rgba(0,0,0,.34),0 0 28px rgba(79,172,254,.08);}
.stat:hover::after{opacity:1;}
.stat-val{font-size:clamp(32px,4vw,42px);font-weight:900;color:var(--accent);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;}
.stat-lbl{font-weight:650;margin-top:10px;font-size:13px;color:#eef8ff;}
.stat-sub{color:rgba(160,160,184,.68);font-size:11.5px;margin-top:4px;line-height:1.5;}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.stats-wrap{margin-top:4px}}

/* About */
.about-text p{color:var(--t2);font-size:16px;line-height:1.75;margin-bottom:14px;}

/* Services */
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:900px){.svc-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.svc-grid{grid-template-columns:1fr}}
.svc-card{background:linear-gradient(180deg,rgba(15,16,24,.92),rgba(10,10,16,.94));border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:26px;transition:all .3s;position:relative;overflow:hidden;min-height:220px;}
.svc-card::before{content:"";position:absolute;right:-38px;top:-38px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(0,210,255,.12),transparent 68%);filter:blur(12px);opacity:.9;pointer-events:none;}
.svc-card:hover{transform:translateY(-6px);border-color:rgba(0,210,255,.26);box-shadow:0 22px 54px rgba(0,0,0,.34),0 0 34px rgba(0,210,255,.10);}
.svc-ico{font-size:24px;margin-bottom:18px;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
.svc-card h3{font-size:17px;font-weight:700;margin-bottom:8px;letter-spacing:-.02em;max-width:14ch;line-height:1.15;position:relative;z-index:1;}
.svc-card p{color:var(--t2);font-size:13px;line-height:1.65;position:relative;z-index:1;max-width:28ch;}

/* Classes */
.class-list{display:grid;gap:12px;margin-bottom:22px;}
.class-item{display:flex;gap:18px;align-items:flex-start;background:linear-gradient(180deg,rgba(15,16,24,.92),rgba(11,12,18,.96));border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:22px 24px;transition:all .25s;}
.class-item:hover{border-color:rgba(0,210,255,.24);transform:translateX(4px);box-shadow:0 16px 36px rgba(0,0,0,.22);}
.class-num{flex:none;width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;}
.class-item h3{font-size:16px;font-weight:600;margin-bottom:3px;}
.class-item p{color:var(--t2);font-size:13px;margin:0;}
.note-box{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,rgba(0,210,255,.08),rgba(58,123,213,.05));border:1px solid rgba(0,210,255,.16);border-radius:18px;padding:20px 24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
.note-ico{font-size:26px;}
.note-box strong{font-size:15px;font-weight:700;}
.note-box p{color:var(--t2);font-size:13px;margin-top:3px;}
.note-cta{margin-top:20px;display:flex;justify-content:center;}

/* Portfolio Filters */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
.filter-chip{padding:8px 18px;border-radius:100px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--b1);color:var(--t2);background:var(--s1);transition:all .25s;}
.filter-chip:hover,.filter-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(79,172,254,.06);box-shadow:0 0 20px rgba(79,172,254,.1);}
.filter-chip.active{background:rgba(79,172,254,.1);border-color:var(--accent);color:var(--accent);}

/* Video Grid */
.v-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
@media(max-width:700px){.v-grid{grid-template-columns:1fr;}}
.v-card{position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;
  background:var(--s1);border:1px solid var(--b1);transition:all .35s;}
.v-card:hover{transform:translateY(-5px);border-color:var(--b3);box-shadow:0 24px 60px rgba(0,0,0,.45);}
.v-card:hover .v-play-ico{transform:scale(1.06);opacity:1;}
.v-card:hover .v-thumb img{transform:scale(1.04);}
.v-thumb{aspect-ratio:16/9;position:relative;overflow:hidden;background:var(--s2);}
.v-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
.v-short img{transform:scale(1.45);object-position:center 25%;}
.v-card:hover .v-short img{transform:scale(1.55);}
.v-thumb-bg{position:absolute;inset:0;background-size:cover!important;background-position:center!important;
  background-repeat:no-repeat;transition:transform .5s;transform:scale(1.25);}
.v-card:hover .v-thumb-bg{transform:scale(1.35);}
.v-card:hover .v-thumb img{transform:scale(1.08);}
.v-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,5,8,.7) 0%,transparent 35%,transparent 75%);}
.v-play{position:absolute;inset:0;display:grid;place-items:center;z-index:2;opacity:.35;transition:all .3s;}
.v-play-ico{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);border:1.5px solid rgba(255,255,255,.18);display:grid;place-items:center;}
.v-play-ico::after{content:"";border-left:15px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:2px;}
.v-body{padding:16px 20px 20px;position:relative;z-index:1;}
.v-cat{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px;}
.v-body h3{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px;}
.v-desc{color:var(--t3);font-size:12px;line-height:1.4;}

/* Testimonials */
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:860px){.testi-grid{grid-template-columns:1fr}}
.testi-card{background:linear-gradient(180deg,rgba(15,16,24,.92),rgba(10,10,16,.96));border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:28px 24px;position:relative;transition:all .3s;overflow:hidden;}
.testi-card::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(0,210,255,.10),transparent 72%);filter:blur(14px);pointer-events:none;}
.testi-card:hover{border-color:rgba(0,210,255,.22);box-shadow:0 18px 42px rgba(0,0,0,.24);}
.testi-card::before{content:"\201C";position:absolute;top:0;left:16px;font-size:56px;font-family:Georgia,serif;color:rgba(0,210,255,.16);line-height:1;}
.testi-q{margin:10px 0;color:var(--t2);font-size:14px;line-height:1.65;}
.testi-n{font-weight:700;font-size:14px;}
.testi-r{color:var(--t3);font-size:12px;margin-top:1px;}

/* Contact */
.contact-box{padding:44px 44px 40px;background:linear-gradient(135deg,rgba(13,18,28,.94),rgba(10,11,18,.985));border:1px solid rgba(255,255,255,.07);border-radius:30px;box-shadow:0 24px 70px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.04);position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);gap:34px;align-items:center;}
.contact-box::before{content:"";position:absolute;inset:auto auto -72px -56px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(0,210,255,.14),transparent 70%);filter:blur(18px);pointer-events:none;}
.contact-box::after{content:"";position:absolute;top:-80px;right:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(58,123,213,.08),transparent 72%);filter:blur(26px);pointer-events:none;}
.contact-copy,.contact-actions{position:relative;z-index:1;}
.contact-copy .label{margin-bottom:18px;}
.contact-box h2{font-size:clamp(34px,4.8vw,56px);line-height:.95;letter-spacing:-.055em;margin:0;max-width:9ch;}
.contact-actions{display:flex;flex-direction:column;align-items:flex-start;gap:18px;}
.contact-box p{color:var(--t2);font-size:15px;line-height:1.75;max-width:35ch;margin:0;}
.contact-cta{display:flex;gap:12px;justify-content:flex-start;flex-wrap:wrap;}
.contact-cta .btn{min-width:118px;justify-content:center;}

footer{padding:22px 32px 34px;text-align:center;color:rgba(160,160,184,.55);font-size:11px;letter-spacing:.03em;border-top:1px solid rgba(255,255,255,.04);}
footer em{font-style:normal;color:rgba(0,210,255,.72);}
@media(max-width:860px){.contact-box{grid-template-columns:1fr;padding:38px 24px 34px;gap:18px;text-align:left;}.contact-box h2{max-width:12ch;font-size:clamp(30px,9vw,42px);}.contact-actions{align-items:flex-start;}.contact-cta{justify-content:flex-start;}.contact-cta .btn{min-width:0;}}

.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);backdrop-filter:blur(12px);align-items:center;justify-content:center;}
.modal.open{display:flex;}
.modal-x{position:absolute;top:24px;right:24px;z-index:201;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;transition:all .2s;}
.modal-x:hover{background:rgba(255,255,255,.1);}
.modal-vid{width:min(92vw,1000px);aspect-ratio:16/9;}
.modal-vid iframe{width:100%;height:100%;border:0;border-radius:10px;}

.reveal{opacity:1;transform:none;transition:opacity .65s cubic-bezier(.25,.6,.2,1),transform .65s cubic-bezier(.25,.6,.2,1);}
.reveal.in{opacity:1;transform:translateY(0);}
@media(prefers-reduced-motion){.reveal{opacity:1;transform:none}}
</style></head><body>
<div class="bg-grid"></div>
<div class="cursor"></div>
<div class="cursor-dot"></div>
<div id="app"></div>
<script>
(function(){
let E=s=>{let d=document.createElement('span');d.textContent=s??"";return d.innerHTML;};
let ytId=u=>{let m=String(u??"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);return m?m[1]:u;};
let thumb=id=>'https://i.ytimg.com/vi/'+id+'/maxresdefault.jpg';
let customThumbs={'v6Kiu2qaIsY':'/assets/shortmovie-highlight-hd.jpg'};
let nl2p=t=>String(t??"").split(/\n{2,}|\n/).filter(x=>x.trim()).map(p=>'<p>'+E(p)+'</p>').join('');

function sec(id,label,title,desc,body){
  return `<section id="${id}" class="section reveal"><div class="section-inner"><span class="label">${E(label)}</span><h2>${E(title)}</h2>${desc?`<p class="desc">${E(desc)}</p>`:''}${body}</div></section>`;
}

function render(){
  let D=window.SD||{};
  let brand=D.brand||"Seru Digital";
  let hvid=D.heroVideo||"/mascot.mp4";
  let vids=D.videos||[];

  let catAssign={};
  (D.videos||[]).forEach((v,i)=>{
    let t=v.title||'';let d=v.desc||'';
    if(/beauty|product|fashion|klinik|iklan|komersil/i.test(t+' '+d))catAssign[i]='Commercial';
    else if(/layanan|masyarakat|paspor|public|ilm/i.test(t+' '+d))catAssign[i]='Public Service';
    else if(/social|met gala|transform/i.test(t+' '+d))catAssign[i]='Social Content';
    else if(/edukasi|sejarah|pendidikan|education|talking/i.test(t+' '+d))catAssign[i]='Educational';
    else catAssign[i]='Commercial';
  });
  let usedCats=[...new Set(Object.values(catAssign))];

  let nav=`<nav class="nav"><div class="nav-inner"><span class="nav-brand">${E(brand)}</span><div class="nav-menu"><a href="#layanan">Layanan</a><a href="#kelas">Kelas</a><a href="#karya">Karya</a><a href="#testimoni">Testimoni</a>${D.whatsapp?`<a class="nav-wa" href="${E(D.whatsapp)}" target="_blank" aria-label="Chat WhatsApp">✆</a>`:''}<a class="nav-cta" href="#kontak">Mulai Project</a></div></div></nav>`;

  let heroBg=`<div class="hero-bg"><video autoplay muted loop playsinline preload="auto" src="${E(hvid)}"></video></div>`;
  let hero=`<section class="hero">${heroBg}<div class="hero-content"><div class="hero-copy">
    <span class="hero-chip">${E(D.heroEyebrow||'Kreator & Mentor Video Animasi AI')}</span>
    <h1>${(D.heroTitle||'Mengubah ide jadi cerita visual yang hidup.').replace('cerita visual','<em>cerita visual</em>')}</h1>
    <p class="hero-sub">${E(D.heroText||'Seru Digital membuat video animasi dan konten sinematik berbasis AI, sekaligus mengajarkan orang cara memproduksinya sendiri lewat ekosistem SERU DIGITAL LABS.')}</p>
    <div class="hero-btns"><a class="btn btn-fill" href="#karya">Lihat Karya</a><a class="btn btn-line" href="#kontak">Ajak Kolaborasi</a></div>
  </div></div></section>`;

  let featured=vids.slice(0,Math.min(vids.length,6));
  let reelCard=(v,pos)=>{
    if(!v)return '<div></div>';
    let id=ytId(v.youtube),img=id?(customThumbs[id]||thumb(id)):'';
    return `<article class="reel-card ${pos}" data-video="${E(v.youtube||'')}" tabindex="0"><img src="${E(img)}" alt="${E(v.title||'Video showcase')}" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${id}/hqdefault.jpg'"><div class="reel-play"></div><div class="reel-meta"><div class="reel-pill">Featured Work</div><h4>${E(v.title||'Untitled')}</h4><p>${E(v.desc||'Karya pilihan Seru Digital untuk brand, storytelling, dan campaign visual.')}</p></div></article>`;
  };
  let showcaseSec='';
  if(featured.length>=1){
    showcaseSec=`<section id="karya" class="section reveal"><div class="section-inner"><div class="showcase-shell"><div class="showcase-top"><div><span class="showcase-kicker">Curated Highlights</span><h3>Pilihan karya terbaik Seru Digital.</h3></div><div class="showcase-nav"><button class="showcase-btn" id="showPrev" aria-label="Sebelumnya">←</button><button class="showcase-btn" id="showNext" aria-label="Berikutnya">→</button></div></div><div class="showcase-stage" id="showcaseStage"><div class="showcase-track" id="showcaseTrack" data-items='${E(JSON.stringify(featured))}'></div></div><div class="showcase-caption"><div><strong id="showcaseTitle">Featured Work</strong><span id="showcaseMeta">Selected project showcase</span></div><div class="showcase-dots" id="showcaseDots"></div></div></div></div></section>`;
  }

  let statsHtml='<div class="stats">'+(D.stats||[]).map(s=>`<div class="stat"><div class="stat-val" data-target="${E(s.value)}">0</div><div class="stat-lbl">${E(s.label)}</div><div class="stat-sub">${E(s.caption)}</div></div>`).join('')+'</div>';
  let statsSec=`<section id="stats" class="section reveal"><div class="section-inner"><div class="stats-wrap">${statsHtml}</div></div></section>`;

  let svcHtml='<div class="svc-grid">'+(D.services||[]).map(s=>`<div class="svc-card"><div class="svc-ico">${E(s.icon)}</div><h3>${E(s.title)}</h3><p>${E(s.desc)}</p></div>`).join('')+'</div>';
  let svcSec=sec('layanan','Layanan','Sistem kreatif untuk brand yang mau tampil lebih tajam.','Video AI, campaign visuals, cinematic edits, dan workflow produksi yang siap dipakai untuk kebutuhan brand, campaign, dan personal IP.',svcHtml);

  let classHtml='<div class="class-list">'+(D.classItems||[]).map((c,i)=>`<div class="class-item"><div class="class-num">${i+1}</div><div><h3>${E(c.title)}</h3><p>${E(c.desc)}</p></div></div>`).join('')+
    '</div><div class="note-box"><div class="note-ico">🎓</div><div><strong>SERU DIGITAL LABS</strong><p>Ekosistem belajar berisi materi, tools SERA, dan komunitas — membantu kamu menguasai produksi video animasi AI dari nol sampai mahir.</p></div></div>'+
    '<div class="note-cta"><a class="btn btn-fill" href="'+(D.whatsapp||'#kontak')+'" target="_blank">Gabung Sekarang</a></div>';
  let classSec=sec('kelas','Belajar',D.classTitle||'Belajar bareng Seru Digital',D.classText||'Belajar produksi video AI tanpa bahasa ribet. Fokus ke workflow yang benar-benar kepakai buat bikin karya dan project klien.',classHtml);

  let filterBar='<div class="filter-bar"><button class="filter-chip active" data-cat="all">Semua</button>';
  usedCats.forEach(c=>{filterBar+=`<button class="filter-chip" data-cat="${E(c)}">${E(c)}</button>`;});
  filterBar+='</div>';

  let vidHtml='<div class="v-grid">'+(D.videos||[]).map((v,i)=>{
    let id=ytId(v.youtube),img=id?thumb(id):'';
    let isShort=/shorts/.test(v.youtube||'');
    let thumbHtml='';
    if(id){
      if(isShort){
        thumbHtml=`<div class="v-thumb-bg" style="background-image:url('${img}');background-size:cover;background-position:center"></div>`;
      }else{
        thumbHtml=`<img src="${E(img)}" alt="${E(v.title)}" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${id}/sddefault.jpg'">`;
      }
    }
    return `<article class="v-card" data-cat="${E(catAssign[i]||'Commercial')}" data-video="${E(v.youtube)}"><div class="v-thumb${isShort?' v-short':''}">${thumbHtml}<div class="v-play"><div class="v-play-ico"></div></div></div><div class="v-body"><div class="v-cat">${E(catAssign[i]||'Commercial')}</div><h3>${E(v.title)}</h3><div class="v-desc">${E(v.desc)}</div></div></article>`;
  }).join('')+'</div>';
  let testiHtml='<div class="testi-grid">'+(D.testimonials||[]).map(t=>`<div class="testi-card"><p class="testi-q">${E(t.quote)}</p><div class="testi-n">${E(t.name)}</div><div class="testi-r">${E(t.meta)}</div></div>`).join('')+'</div>';
  let testiSec=sec('testimoni','Testimoni','Respons dari orang yang pernah kerja bareng atau belajar langsung.','',testiHtml);

  let ctBtns='<a class="btn btn-fill" href="mailto:'+E(D.email)+'">Email Saya</a>'+
    (D.whatsapp?'<a class="btn btn-line" href="'+E(D.whatsapp)+'" target="_blank">WhatsApp</a>':'')+
    (D.instagram?'<a class="btn btn-line" href="'+E(D.instagram)+'" target="_blank">Instagram</a>':'');
  let contactSec=`<section id="kontak" class="section reveal"><div class="section-inner"><div class="contact-box"><div class="contact-copy"><span class="label">Kontak</span><h2>${E(D.contactTitle||'Ayo kerja bareng')}</h2></div><div class="contact-actions"><p>${E(D.contactText||'Punya project video, butuh konten, atau ingin belajar? Hubungi Seru Digital.')}</p><div class="contact-cta">${ctBtns}</div></div></div></div></section>`;

  let footer=`<footer>${E(brand)} <em>✦</em> SERU DIGITAL LABS <em>✦</em> 2026</footer>`;
  let modal=`<div class="modal" id="videoModal"><button class="modal-x" id="modalClose">&times;</button><div class="modal-vid"><iframe id="modalIframe" src="" allow="autoplay;encrypted-media" allowfullscreen></iframe></div></div>`;

  document.getElementById("app").innerHTML=nav+hero+statsSec+showcaseSec+svcSec+classSec+testiSec+contactSec+footer+modal;
  init();
}

function init(){
  let showcaseTrack=document.getElementById('showcaseTrack');
  if(showcaseTrack){
    let showcaseStage=document.getElementById('showcaseStage');
    let items=[];
    try{items=JSON.parse(showcaseTrack.dataset.items||'[]')}catch{}
    let progress=0;
    let drag={active:false,startX:0,currentX:0,moved:false,startProgress:0};
    let dots=document.getElementById('showcaseDots');
    let titleEl=document.getElementById('showcaseTitle');
    let metaEl=document.getElementById('showcaseMeta');
    if(dots){dots.innerHTML=items.map((_,i)=>`<span class="showcase-dot${i===0?' active':''}"></span>`).join('');}
    const rel=(i,p=progress)=>{
      let diff=i-p;
      let half=items.length/2;
      while(diff>half) diff-=items.length;
      while(diff<-half) diff+=items.length;
      return diff;
    };
    const applyTransforms=()=>{
      if(!items.length)return;
      let cards=showcaseTrack.querySelectorAll('.reel-card');
      cards.forEach((card,i)=>{
        let r=rel(i);
        let abs=Math.abs(r);
        let x=r*305;
        let scale=Math.max(.58,1-(abs*.16));
        let rot=-r*26;
        let opacity=Math.max(0,1-(abs*.34));
        let z=60-(abs*28);
        let blur=Math.max(0,(abs-1.4)*1.2);
        card.style.transform=`translateX(calc(-50% + ${x}px)) rotateY(${rot}deg) scale(${scale}) translateZ(${z}px)`;
        card.style.opacity=String(opacity);
        card.style.zIndex=String(Math.round(100-abs*10));
        card.style.filter=`blur(${blur}px) saturate(${Math.max(.68,1-abs*.12)})`;
        card.classList.toggle('is-active', abs<0.5);
        card.style.pointerEvents = abs>2.6 ? 'none' : 'auto';
      });
      let cur=items[((Math.round(progress)%items.length)+items.length)%items.length];
      if(titleEl) titleEl.textContent=cur.title||'Featured Work';
      if(metaEl) metaEl.textContent=cur.desc||'Selected project showcase';
      dots?.querySelectorAll('.showcase-dot').forEach((d,i)=>d.classList.toggle('active',i===((Math.round(progress)%items.length)+items.length)%items.length));
    };
    let paint=()=>{
      if(!items.length)return;
      showcaseTrack.innerHTML=items.map((v,i)=>{
        let id=ytId(v.youtube),img=id?(customThumbs[id]||thumb(id)):'';
        return `<article class="reel-card" data-index="${i}" data-video="${E(v.youtube||'')}" tabindex="0"><img src="${E(img)}" alt="${E(v.title||'Video showcase')}" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${id}/hqdefault.jpg'"><div class="reel-play"></div><div class="reel-meta"><div class="reel-pill">Preview</div><h4>${E(v.title||'Untitled')}</h4><p>${E(v.desc||'Karya pilihan Seru Digital.')}</p></div></article>`;
      }).join('');
      showcaseTrack.querySelectorAll('.reel-card').forEach(c=>c.addEventListener('click',()=>{
        if(drag.moved){drag.moved=false;return;}
        let vid=c.dataset.video,id=ytId(vid),modal=document.getElementById('videoModal'),iframe=document.getElementById('modalIframe');if(!id)return;iframe.src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';modal.classList.add('open');document.body.style.overflow='hidden';
      }));
      applyTransforms();
    };
    paint();
    document.getElementById('showPrev')?.addEventListener('click',()=>{progress-=1;applyTransforms();});
    document.getElementById('showNext')?.addEventListener('click',()=>{progress+=1;applyTransforms();});
    let start=(x)=>{drag.active=true;drag.startX=x;drag.currentX=x;drag.moved=false;drag.startProgress=progress;showcaseStage.classList.add('dragging');};
    let move=(x)=>{if(!drag.active)return; drag.currentX=x; let dx=x-drag.startX; if(Math.abs(dx)>8) drag.moved=true; progress=drag.startProgress-(dx/260); applyTransforms();};
    let end=(x)=>{if(!drag.active)return; drag.active=false; showcaseStage.classList.remove('dragging'); let target=Math.round(progress); let startP=progress; let startT=performance.now(); let dur=320; let anim=(now)=>{ let t=Math.min(1,(now-startT)/dur); let e=1-Math.pow(1-t,3); progress=startP+(target-startP)*e; applyTransforms(); if(t<1) requestAnimationFrame(anim); else progress=target; }; requestAnimationFrame(anim); };
    showcaseStage.addEventListener('mousedown',e=>start(e.clientX));
    window.addEventListener('mousemove',e=>move(e.clientX));
    window.addEventListener('mouseup',e=>end(e.clientX));
    showcaseStage.addEventListener('touchstart',e=>start(e.touches[0].clientX),{passive:true});
    window.addEventListener('touchmove',e=>move(e.touches[0].clientX),{passive:true});
    window.addEventListener('touchend',e=>end((e.changedTouches&&e.changedTouches[0]&&e.changedTouches[0].clientX)||drag.startX),{passive:true});
    // auto-rotate dimatikan dulu agar tidak bentrok dengan progress-based wheel
  }

  document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener("click",function(e){
    e.preventDefault();let t=document.querySelector(this.getAttribute("href"));if(t)t.scrollIntoView({behavior:"smooth"});
  }));
  let formatStatValue=(raw,v)=> raw.includes('thn') ? `${v} thn` : `${v}${raw.replace(/[\d\s]/g,'')||''}`;
  let animateStatCounter=(el)=>{
    if(!el) return;
    let raw=(el.dataset.target||'0').trim();
    let num=parseInt(raw.replace(/\D/g,''),10)||0;
    let duration=950;
    let start=null;
    let token=String(Date.now()+Math.random());
    el.dataset.animToken=token;
    el.textContent=formatStatValue(raw,0);
    let tick=(ts)=>{
      if(el.dataset.animToken!==token) return;
      if(start===null) start=ts;
      let p=Math.min(1,(ts-start)/duration);
      let eased=1-Math.pow(1-p,3);
      let current=Math.round(num*eased);
      el.textContent=formatStatValue(raw,current);
      if(p<1) requestAnimationFrame(tick);
      else el.textContent=raw;
    };
    requestAnimationFrame(tick);
  };
  let bindStatCounters=()=>{
    let cards=document.querySelectorAll('.stat');
    if(!cards.length) return;
    cards.forEach(card=>{
      let val=card.querySelector('.stat-val[data-target]');
      if(!val) return;
      val.textContent=(val.dataset.target||'0').trim();
      let trigger=()=>animateStatCounter(val);
      card.addEventListener('mouseenter',trigger);
      card.addEventListener('focusin',trigger);
    });
  };
  bindStatCounters();
  document.querySelector(".filter-bar")?.addEventListener("click",function(e){
    let btn=e.target.closest(".filter-chip");if(!btn)return;
    this.querySelectorAll(".filter-chip").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".v-card").forEach(c=>c.style.display=(btn.dataset.cat==="all"||c.dataset.cat===btn.dataset.cat)?"":"none");
  });
  let modal=document.getElementById("videoModal"),iframe=document.getElementById("modalIframe");
  document.querySelectorAll(".v-card").forEach(c=>c.addEventListener("click",()=>{
    let vid=c.dataset.video,id=ytId(vid);if(!id)return;
    iframe.src="https://www.youtube.com/embed/"+id+"?autoplay=1&rel=0";modal.classList.add("open");document.body.style.overflow="hidden";
  }));
  let close=()=>{modal.classList.remove("open");iframe.src="";document.body.style.overflow="";};
  document.getElementById("modalClose").addEventListener("click",close);
  modal.addEventListener("click",e=>{if(e.target===modal)close()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  let obs=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");obs.unobserve(e.target);}})},{threshold:.06,rootMargin:"0px 0px -16px 0px"});
  document.querySelectorAll(".reveal").forEach(el=>{el.classList.add("in");obs.observe(el);});
  // Custom cursor
  let cr=document.querySelector(".cursor"),cd=document.querySelector(".cursor-dot");
  document.addEventListener("mousemove",e=>{let x=e.clientX,y=e.clientY;cr.style.left=x+"px";cr.style.top=y+"px";cd.style.left=x+"px";cd.style.top=y+"px";});
  document.querySelectorAll("a,button,.v-card,.filter-chip,.btn").forEach(el=>{
    el.addEventListener("mouseenter",()=>cr.classList.add("hover"));
    el.addEventListener("mouseleave",()=>cr.classList.remove("hover"));
  });
}

window.SD={};
fetch("data/content.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{window.SD=j||{};render();}).catch(()=>render());
})();
</script></body></html>
