<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seru Digital</title>
<meta name="description" content="Seru Digital — Cinematic AI Video Production. Studio kreatif video animasi & konten sinematik berbasis AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c;--cream:#f4efe8;--text:#f0f0f2;--muted:#9898a4;--faint:#5c5c6a;
  --surface:rgba(255,255,255,.04);--surface2:rgba(255,255,255,.08);--border:rgba(255,255,255,.08);
  --accent:#5cfcc9;--accent2:#7c6ff7;
  --serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,sans-serif;
  --maxw:1280px;--radius:12px;
}
*{box-sizing:border-box;margin:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}

/* NV */
.nav{position:fixed;top:0;z-index:100;width:100%; 
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:rgba(10,10,12,.75);border-bottom:1px solid var(--border);}
.nav-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;}
.brand{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em;}
.nav-links{display:flex;gap:32px;align-items:center;}
.nav-links a{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);transition:color .2s;}
.nav-links a:hover{color:var(--text);}
.nav-cta{padding:10px 22px;border:1px solid var(--text);border-radius:999px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;transition:all .2s;}
.nav-cta:hover{background:var(--text);color:var(--bg);}
@media(max-width:768px){.nav-links a:not(.nav-cta){display:none;}.nav-inner{padding:14px 20px;}}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden;}
.hero-bg{position:absolute;inset:0;}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,.3),rgba(10,10,12,.8) 65%,var(--bg));}
.hero-bg video,.hero-bg iframe{position:absolute;top:50%;left:50%;width:177.78vh;height:56.25vw;min-width:100%;min-height:100%;transform:translate(-50%,-50%);object-fit:cover;pointer-events:none;border:0;}
.hero-content{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;padding:0 32px;width:100%;}
.hero-tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:24px;}
.hero-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
.hero h1{font-family:var(--serif);font-size:clamp(42px,7vw,84px);line-height:1.04;font-weight:600;margin-bottom:20px;max-width:14ch;}
.hero h1 i{font-style:italic;
  background:linear-gradient(120deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{font-size:clamp(15px,2vw,18px);color:var(--muted);max-width:52ch;margin-bottom:36px;line-height:1.6;}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;}
.btn{padding:14px 30px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;transition:all .25s;}
.btn-primary{background:var(--text);color:var(--bg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(255,255,255,.12);}
.btn-ghost{border-color:rgba(255,255,255,.25);color:var(--text);
  background:transparent;}
.btn-ghost:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 0 24px rgba(92,252,201,.08);}
.btn-ghost .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
@media(max-width:600px){.hero{padding-top:80px;min-height:90vh;}}

/* SECTION */
.section{padding:80px 32px;position:relative;}
.section-inner{max-width:var(--maxw);margin:0 auto;}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
.tag .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.section h2{font-family:var(--serif);font-size:clamp(30px,4.5vw,54px);font-weight:600;line-height:1.08;margin-bottom:16px;}
.section h2 i{font-style:italic;color:var(--accent);}
.section-sub{color:var(--muted);font-size:16px;max-width:54ch;margin-bottom:40px;}

/* HUD frame */
.hud{border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);position:relative;overflow:hidden;
  background:rgba(255,255,255,.015);}
.hud::before,.hud::after,.hud-inner::before,.hud-inner::after{
  content:"";position:absolute;width:16px;height:16px;border-color:rgba(255,255,255,.12);z-index:1;}
.hud::before{top:0;left:0;border-top:1px solid var(--accent);border-left:1px solid var(--accent);}
.hud::after{top:0;right:0;border-top:1px solid var(--accent);border-right:1px solid var(--accent);}
.hud .hud-inner::before{bottom:0;left:0;border-bottom:1px solid var(--accent);border-left:1px solid var(--accent);}
.hud .hud-inner::after{bottom:0;right:0;border-bottom:1px solid var(--accent);border-right:1px solid var(--accent);}

/* FILTER */
.filters{display:flex;gap:28px;margin-bottom:36px;overflow-x:auto;padding-bottom:4px;}
.filters button{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 0;position:relative;white-space:nowrap;transition:color .2s;}
.filters button.active{color:var(--accent);}
.filters button.active::after{content:"";position:absolute;bottom:0;left:0;right:0;height:1px;background:var(--accent);}

/* VIDEO GRID */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:24px;}
@media(max-width:500px){.video-grid{grid-template-columns:1fr;}}
.video-card{position:relative;border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);overflow:hidden;cursor:pointer;
  background:rgba(255,255,255,.02);transition:all .35s;}
.video-card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.15);box-shadow:0 16px 48px rgba(0,0,0,.5);}
.video-card:hover .play-btn{transform:scale(1.1);opacity:1;}
.video-thumb{aspect-ratio:16/9;position:relative;overflow:hidden;background:#111;}
.video-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
.video-card:hover .video-thumb img{transform:scale(1.04);}
.video-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,10,12,.7),transparent 50%);}
.play-btn{position:absolute;inset:0;display:grid;place-items:center;z-index:2;opacity:.7;transition:all .3s;}
.play-circle{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;backdrop-filter:blur(6px);
  background:rgba(0,0,0,.3);}
.play-circle::after{content:"";border-left:16px solid rgba(255,255,255,.9);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:3px;}
.video-meta{padding:18px 20px;position:relative;z-index:1;}
.video-meta .cat{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
.video-meta h3{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:6px;}
.video-meta .year{font-size:11px;color:var(--faint);}

/* MODAL */
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);
  backdrop-filter:blur(8px);align-items:center;justify-content:center;}
.modal.open{display:flex;}
.modal-close{position:absolute;top:24px;right:24px;z-index:201;width:48px;height:48px;border-radius:50%;
  border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.6);color:#fff;font-size:22px;cursor:pointer;
  display:grid;place-items:center;transition:all .2s;}
.modal-close:hover{background:rgba(255,255,255,.1);}
.modal-video{width:min(92vw,1100px);aspect-ratio:16/9;position:relative;}
.modal-video iframe{width:100%;height:100%;border:0;border-radius:var(--radius);}

/* Light section */
.light{background:var(--cream);color:#1a1a1e;}
.light .tag{color:#333;}
.light .tag .dot{background:#333;box-shadow:none;}
.light h2{color:#1a1a1e;}
.light h2 i{color:#555;}
.light .section-sub{color:#666;}

/* CONTACT */
.contact-card{text-align:center;padding:80px 32px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:24px;}
.contact-card h2{font-family:var(--serif);font-size:clamp(28px,4vw,48px);margin-bottom:12px;}
.contact-card p{color:var(--muted);margin-bottom:32px;}
.contact-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}

/* FOOTER */
footer{padding:40px 32px;text-align:center;color:var(--faint);font-size:13px;border-top:1px solid var(--border);}
footer .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);display:inline-block;margin:0 8px;}

/* Scroll reveal */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1);}
.reveal.in{opacity:1;transform:translateY(0);}
@media(prefers-reduced-motion){.reveal{opacity:1;transform:none;}}
</style></head><body><div id="app"></div><script>
(function(){
var D={
  brand:"Seru Digital",
  heroEyebrow:"AI VIDEO PRODUCTION STUDIO",
  heroTitle:"Membuat cerita yang <i>mustahil</i> jadi <i>terlihat</i>.",
  heroText:"Studio produksi video animasi & konten sinematik berbasis AI. Dari konsep, produksi, sampai post — semua dalam satu pipeline.",
  heroVideo:"https://youtu.be/3WrXGJdL8mU",
  whyTitle:"Kenapa <i>Seru Digital</i>",
  whyText:"Lebih dari sekadar bikin video — kamu dapat partner kreatif yang ngerti hasil, proses, dan ilmunya.",
  whyItems:[
    {i:"⚡",t:"Berbasis AI Terkini",d:"Workflow & tools AI terbaru biar hasil cepat, konsisten, dan sinematik."},
    {i:"🎯",t:"Hasil Premium",d:"Kualitas visual setara studio, disesuaikan dengan brand kamu."},
    {i:"🤝",t:"Komunikasi Enak",d:"Proses jelas, update rutin, revisi tanpa drama."},
    {i:"🎓",t:"Sekaligus Mentor",d:"Bukan cuma bikin — kami juga ngajarin kamu produksi sendiri."},
    {i:"🚀",t:"Pengerjaan Cepat",d:"Alur kerja efisien, deadline aman tanpa korbankan kualitas."},
    {i:"🌐",t:"Ekosistem LABS",d:"Materi, tools SERA, & komunitas yang terus berkembang."}
  ],
  videos:[
    {t:"SUNSHIELD",c:"Commercial",d:"Beauty clinic — cinematic product video.",y:"pjTFAE8wPis",yr:"2025"},
    {t:"M PASPOR",c:"Public Service",d:"ILM — informative content for M Paspor.",y:"HqrmwXNvFqo",yr:"2025"},
    {t:"EMS SCULPTING",c:"Commercial",d:"Treatment video showcasing EMS technology.",y:"3fR06DUR6rc",yr:"2025"},
    {t:"Met Gala",c:"Social Content",d:"Singapore client — Met Gala themed.",y:"qcgmXhwPgz4",yr:"2025"},
    {t:"Transformation",c:"Social Content",d:"Visual transformation with AI animation.",y:"ZsJL9f9Zc9s",yr:"2024"},
    {t:"History",c:"Educational",d:"Cinematic history-themed content.",y:"WbqSByOgOyY",yr:"2025"},
    {t:"GAMIS BONO",c:"Commercial",d:"Fashion product video for Gamis Bono.",y:"_Yx_mJkfT2c",yr:"2025"},
    {t:"Talking Character",c:"Educational",d:"Talking character for education.",y:"IHA5FdGnPmQ",yr:"2025"}
  ],
  contactTitle:"Mulai sebuah <i>project</i>",
  contactText:"Punya ide cerita, butuh konten, atau ingin belajar? Hubungi Seru Digital.",
  email:"seru.ilmu@gmail.com",whatsapp:"https://wa.me/6285757305799",
  instagram:"https://instagram.com/seru.digital",
  tiktok:"https://www.tiktok.com/@seru.digital"
};

function ytId(u){var m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);return m?m[1]:u;}
function thumb(id){return 'https://img.youtube.com/vi/'+id+'/hqdefault.jpg';}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function render(){
  var nav='<nav class="nav"><div class="nav-inner"><span class="brand">'+esc(D.brand)+'</span><div class="nav-links"><a href="#karya">Karya</a><a href="#layanan">Layanan</a><a href="#kenapa">Kenapa</a><a href="#kontak" class="nav-cta">Mulai Project</a></div></div></nav>';

  var heroBg='';
  if(D.heroVideo){
    var id=ytId(D.heroVideo);
    heroBg=id?'<div class="hero-bg"><iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&loop=1&playlist='+id+'&controls=0&showinfo=0&modestbranding=1&rel=0&playsinline=1" allow="autoplay;encrypted-media" allowfullscreen></iframe></div>':'<div class="hero-bg"></div>';
  }

  var hero='<section class="hero">'+heroBg+
    '<div class="hero-content"><span class="hero-tag"><span class="dot"></span>'+esc(D.heroEyebrow)+'</span>'+
    '<h1>'+D.heroTitle+'</h1><p class="hero-sub">'+esc(D.heroText)+'</p>'+
    '<div class="hero-btns"><a class="btn btn-primary" href="#karya">View Portfolio →</a>'+
    '<a class="btn btn-ghost" href="#kontak"><span class="dot"></span> Free Consultation</a></div></div></section>';

  var cats=[...new Set(D.videos.map(function(v){return v.c;}))];
  var filterHtml='<div class="filters"><button class="active" data-cat="all">ALL</button>'+
    cats.map(function(c){return '<button data-cat="'+esc(c)+'">'+esc(c)+'</button>';}).join("")+'</div>';

  var vidHtml='<div class="video-grid">'+D.videos.map(function(v){
    var id=ytId(v.y);var img=id?thumb(id):'';
    return '<article class="video-card" data-cat="'+esc(v.c)+'" data-video="'+esc(v.y)+'"><div class="video-thumb">'+
      (img?'<img src="'+esc(img)+'" alt="'+esc(v.t)+'" loading="lazy">':'<div style="aspect-ratio:16/9;display:grid;place-items:center;background:#1a1a1e;color:#fff">🎬 '+esc(v.t)+'</div>')+
      '<div class="play-btn"><div class="play-circle"></div></div></div>'+
      '<div class="video-meta"><div class="cat">'+esc(v.c)+'</div><h3>'+esc(v.t)+'</h3><div class="year">'+esc(v.yr)+'</div></div></article>';
  }).join("")+'</div>';

  var karyaSec='<section id="karya" class="section reveal"><div class="section-inner">'+
    '<span class="tag"><span class="dot"></span>SELECTED WORK</span>'+
    '<h2>Cerita yang <i>layak</i> ditonton.</h2>'+
    '<p class="section-sub">Pilihan video yang sudah kami produksi — dari commercial, cinematic, sampai konten edukasi.</p>'+
    '<div class="hud"><div class="hud-inner" style="padding:32px 28px;">'+filterHtml+vidHtml+'</div></div></div></section>';

  var whyHtml='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;">'+
    D.whyItems.map(function(w){return '<div style="background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;transition:all .3s">'+
    '<div style="width:40px;height:40px;border-radius:10px;background:rgba(92,252,201,.1);border:1px solid rgba(92,252,201,.2);display:grid;place-items:center;font-size:20px;margin-bottom:16px">'+esc(w.i)+'</div>'+
    '<h3 style="font-family:var(--serif);font-size:18px;margin-bottom:8px">'+esc(w.t)+'</h3><p style="color:var(--muted);font-size:14px">'+esc(w.d)+'</p></div>';}).join("")+'</div>';

  var whySec='<section id="kenapa" class="section light reveal"><div class="section-inner">'+
    '<span class="tag"><span class="dot"></span>WHY SERU DIGITAL</span>'+
    '<h2>'+D.whyTitle+'</h2><p class="section-sub">'+esc(D.whyText)+'</p>'+whyHtml+'</div></section>';

  var contactBtns='<a class="btn btn-primary" href="mailto:'+esc(D.email)+'">✉️ Email</a>'+
    (D.whatsapp?'<a class="btn btn-ghost" href="'+esc(D.whatsapp)+'" target="_blank">💬 WhatsApp</a>':'')+
    (D.instagram?'<a class="btn btn-ghost" href="'+esc(D.instagram)+'" target="_blank">Instagram</a>':'');
  
  var contactSec='<section id="kontak" class="section reveal"><div class="section-inner"><div class="contact-card">'+
    '<span class="tag"><span class="dot"></span>GET IN TOUCH</span>'+
    '<h2>'+D.contactTitle+'</h2><p>'+esc(D.contactText)+'</p><div class="contact-btns">'+contactBtns+'</div></div></section>';

  var footer='<footer>'+esc(D.brand)+'<span class="dot"></span>SERU DIGITAL LABS<span class="dot"></span>© 2026</footer>';

  var modal='<div class="modal" id="videoModal"><button class="modal-close" id="modalClose">✕</button><div class="modal-video"><iframe id="modalIframe" src="" allow="autoplay;encrypted-media" allowfullscreen></iframe></div></div>';

  document.getElementById("app").innerHTML=nav+hero+karyaSec+whySec+contactSec+footer+modal;
  initReveal();
  initFilters();
  initModals();
  playHeroVideo();
}

function playHeroVideo(){
  var v=document.querySelector(".hero-bg iframe");if(!v)return;
}

function initReveal(){
  if(!("IntersectionObserver" in window)){document.querySelectorAll(".reveal").forEach(function(e){e.classList.add("in");});return;}
  new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");this.unobserve(e.target);}});},{threshold:.1}).observe(document.querySelector(".section")||document.body);
  document.querySelectorAll(".reveal").forEach(function(e){new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");this.unobserve(x.target);}})},{threshold:.12}).observe(e);});
}

function initFilters(){
  document.querySelector(".filters")?.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    document.querySelectorAll(".filters button").forEach(function(x){x.classList.remove("active");});
    b.classList.add("active");
    var cat=b.dataset.cat;
    document.querySelectorAll(".video-card").forEach(function(c){
      c.style.display=(cat==="all"||c.dataset.cat===cat)?"":"none";
    });
  });
}

function initModals(){
  var modal=document.getElementById("videoModal");
  var iframe=document.getElementById("modalIframe");
  document.querySelectorAll(".video-card").forEach(function(card){
    card.addEventListener("click",function(){
      var vid=card.dataset.video;var id=ytId(vid);
      if(!id)return;
      iframe.src="https://www.youtube.com/embed/"+id+"?autoplay=1&rel=0";
      modal.classList.add("open");document.body.style.overflow="hidden";
    });
  });
  document.getElementById("modalClose").addEventListener("click",function(){
    modal.classList.remove("open");iframe.src="";document.body.style.overflow="";
  });
  modal.addEventListener("click",function(e){if(e.target===modal){modal.classList.remove("open");iframe.src="";document.body.style.overflow="";}});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&modal.classList.contains("open")){modal.classList.remove("open");iframe.src="";document.body.style.overflow="";}});
}

render();
})();
</script></body></html>
