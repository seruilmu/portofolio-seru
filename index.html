<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seru Digital</title>
<meta name="description" content="Seru Digital — Studio produksi video animasi & konten sinematik berbasis AI. Juga mentor kelas AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050508;--s1:#0a0a10;--s2:#0f0f18;--s3:#151520;
  --t1:#f2f2f7;--t2:#a0a0b8;--t3:#5c5c72;
  --b1:rgba(255,255,255,.06);--b2:rgba(255,255,255,.10);--b3:rgba(255,255,255,.14);
  --accent:#4facfe;--accent2:#00d4ff;--glow:rgba(79,172,254,.14);
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --maxw:1200px;--radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--t1);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:-30%;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 30% 20%,rgba(79,172,254,.06),transparent 50%),
    radial-gradient(ellipse at 70% 60%,rgba(0,212,255,.04),transparent 50%),
    radial-gradient(ellipse at 50% 80%,rgba(79,172,254,.03),transparent 40%);
  animation:aurora 20s ease-in-out infinite alternate;}
@keyframes aurora{0%{transform:translate(0,0) scale(1)}100%{transform:translate(20px,-15px) scale(1.05)}}

/* Subtle dot grid */
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.03;
  background-image:radial-gradient(rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:32px 32px;}

/* Custom cursor */
.cursor{position:fixed;width:24px;height:24px;border-radius:50%;pointer-events:none;z-index:9999;
  border:1.5px solid rgba(79,172,254,.5);transform:translate(-50%,-50%);
  transition:width .2s,height .2s,border-color .2s;mix-blend-mode:screen;}
.cursor-dot{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:9999;
  background:var(--accent);transform:translate(-50%,-50%);box-shadow:0 0 12px var(--accent);}
.cursor.hover{width:48px;height:48px;border-color:var(--accent);background:rgba(79,172,254,.08);}
@media(max-width:768px),(pointer:coarse){.cursor,.cursor-dot{display:none;}}
img,svg,video{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--accent);color:#fff;}

.nav{position:fixed;top:0;z-index:100;width:100%;
  background:rgba(5,5,8,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--b1);padding:14px 0;}
.nav-inner{max-width:var(--maxw);margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;}
.nav-brand{font-weight:700;font-size:15px;letter-spacing:-.01em;}
.nav-menu{display:flex;gap:6px;align-items:center;}
.nav-menu a{font-size:12.5px;font-weight:500;padding:7px 16px;border-radius:8px;color:var(--t2);transition:all .2s;}
.nav-menu a:hover{color:var(--t1);background:rgba(255,255,255,.05);}
.nav-cta{padding:9px 20px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--t1);color:var(--bg)!important;}
.nav-cta:hover{transform:scale(1.02);box-shadow:0 4px 20px rgba(255,255,255,.06);background:var(--t1)!important;}
@media(max-width:768px){.nav-menu a:not(.nav-cta){display:none;}.nav-inner{padding:0 20px;}}

.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;}
.hero-bg{position:absolute;inset:0;}
.hero-bg video{position:absolute;top:50%;left:50%;width:177.78vh;height:56.25vw;min-width:100%;min-height:100%;transform:translate(-50%,-50%);object-fit:cover;filter:brightness(.5) saturate(.8);}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 35% 50%,var(--glow),transparent 55%),
    linear-gradient(180deg,rgba(5,5,8,.25),rgba(5,5,8,.65) 65%,var(--bg) 95%);}
.hero-content{position:relative;z-index:2;width:100%;max-width:var(--maxw);margin:0 auto;padding:0 32px;}
.hero-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 15px;border:1px solid rgba(255,255,255,.12);border-radius:100px;
  font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);margin-bottom:28px;
  backdrop-filter:blur(6px);background:rgba(255,255,255,.04);animation:fadeUp .7s both;}
.hero-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
.hero h1{font-size:clamp(38px,7vw,78px);line-height:.94;font-weight:900;letter-spacing:-.05em;margin-bottom:22px;max-width:12ch;animation:fadeUp .7s .1s both;}
.hero h1 em{font-style:normal;color:var(--accent);}
.hero-sub{font-size:clamp(14px,1.5vw,17px);color:var(--t2);max-width:42ch;margin-bottom:38px;line-height:1.7;animation:fadeUp .7s .2s both;}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap;animation:fadeUp .7s .3s both;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .25s;}
.btn-fill{background:var(--t1);color:var(--bg);}
.btn-fill:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(255,255,255,.08);}
.btn-line{background:transparent;color:var(--t1);border:1px solid var(--b2);}
.btn-line:hover{transform:translateY(-2px);border-color:var(--b3);background:rgba(255,255,255,.03);}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.hero{padding-top:100px;min-height:90vh;}.hero-content{padding:0 20px;}}

.section{padding:64px 32px;position:relative;z-index:1;}
.section-inner{max-width:var(--maxw);margin:0 auto;}
.label{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
.label::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);}
.section h2{font-size:clamp(24px,3.5vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin-bottom:12px;}
.section p.desc{color:var(--t2);font-size:15px;max-width:44ch;margin-bottom:36px;}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.stat{background:var(--s1);border:1px solid var(--b1);border-radius:var(--radius);padding:28px 24px;transition:all .3s;}
.stat:hover{transform:translateY(-3px);border-color:var(--accent);background:var(--s2);}
.stat-val{font-size:clamp(28px,4vw,40px);font-weight:900;color:var(--accent);letter-spacing:-.02em;line-height:1;}
.stat-lbl{font-weight:600;margin-top:8px;font-size:14px;}
.stat-sub{color:var(--t3);font-size:12px;margin-top:2px;}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);}}

/* About */
.about-text p{color:var(--t2);font-size:16px;line-height:1.75;margin-bottom:14px;}

/* Services */
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:900px){.svc-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.svc-grid{grid-template-columns:1fr}}
.svc-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--radius);padding:28px;transition:all .3s;}
.svc-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 16px 48px var(--glow);}
.svc-ico{font-size:24px;margin-bottom:14px;}
.svc-card h3{font-size:16px;font-weight:700;margin-bottom:6px;}
.svc-card p{color:var(--t2);font-size:13px;line-height:1.6;}

/* Classes */
.class-list{display:grid;gap:12px;margin-bottom:22px;}
.class-item{display:flex;gap:18px;align-items:flex-start;background:var(--s1);border:1px solid var(--b1);border-radius:var(--radius);padding:22px 24px;transition:all .25s;}
.class-item:hover{border-color:var(--accent);transform:translateX(3px);}
.class-num{flex:none;width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;}
.class-item h3{font-size:16px;font-weight:600;margin-bottom:3px;}
.class-item p{color:var(--t2);font-size:13px;margin:0;}
.note-box{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,rgba(167,139,250,.07),rgba(129,140,248,.04));border:1px solid rgba(167,139,250,.15);border-radius:var(--radius);padding:20px 24px;}
.note-ico{font-size:26px;}
.note-box strong{font-size:15px;font-weight:700;}
.note-box p{color:var(--t2);font-size:13px;margin-top:3px;}
.note-cta{margin-top:20px;display:flex;justify-content:center;}

/* Portfolio Filters */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
.filter-chip{padding:8px 18px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--b1);color:var(--t2);background:var(--s1);transition:all .25s;}
.filter-chip:hover{border-color:var(--b2);color:var(--t1);}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* Video Grid */
.v-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
@media(max-width:700px){.v-grid{grid-template-columns:1fr;}}
.v-card{position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;
  background:var(--s1);border:1px solid var(--b1);transition:all .35s;}
.v-card:hover{transform:translateY(-5px);border-color:var(--b3);box-shadow:0 24px 60px rgba(0,0,0,.45);}
.v-card:hover .v-play-ico{transform:scale(1.06);opacity:1;}
.v-card:hover .v-thumb img{transform:scale(1.04);}
.v-thumb{aspect-ratio:16/9;position:relative;overflow:hidden;background:var(--s2);}
.v-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
.v-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,5,8,.75),transparent 35%,transparent 70%);}
.v-play{position:absolute;inset:0;display:grid;place-items:center;z-index:2;opacity:.35;transition:all .3s;}
.v-play-ico{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);border:1.5px solid rgba(255,255,255,.18);display:grid;place-items:center;}
.v-play-ico::after{content:"";border-left:15px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:2px;}
.v-body{padding:16px 20px 20px;}
.v-cat{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px;}
.v-body h3{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px;}
.v-desc{color:var(--t3);font-size:12px;line-height:1.4;}

/* Testimonials */
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:860px){.testi-grid{grid-template-columns:1fr}}
.testi-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--radius);padding:28px 24px;position:relative;transition:all .3s;}
.testi-card:hover{border-color:var(--accent);}
.testi-card::before{content:"\201C";position:absolute;top:0;left:16px;font-size:56px;font-family:Georgia,serif;color:rgba(167,139,250,.18);line-height:1;}
.testi-q{margin:10px 0;color:var(--t2);font-size:14px;line-height:1.65;}
.testi-n{font-weight:700;font-size:14px;}
.testi-r{color:var(--t3);font-size:12px;margin-top:1px;}

/* Contact */
.contact-box{text-align:center;padding:60px 28px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--radius);}
.contact-box h2{font-size:clamp(24px,3.5vw,38px);margin-bottom:10px;}
.contact-box p{color:var(--t2);font-size:15px;margin-bottom:26px;max-width:38ch;margin:0 auto 26px;}
.contact-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

footer{padding:32px;text-align:center;color:var(--t3);font-size:12px;border-top:1px solid var(--b1);}
footer em{font-style:normal;color:var(--accent);}

.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);backdrop-filter:blur(12px);align-items:center;justify-content:center;}
.modal.open{display:flex;}
.modal-x{position:absolute;top:24px;right:24px;z-index:201;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;transition:all .2s;}
.modal-x:hover{background:rgba(255,255,255,.1);}
.modal-vid{width:min(92vw,1000px);aspect-ratio:16/9;}
.modal-vid iframe{width:100%;height:100%;border:0;border-radius:10px;}

.reveal{opacity:0;transform:translateY(36px);transition:opacity .65s cubic-bezier(.25,.6,.2,1),transform .65s cubic-bezier(.25,.6,.2,1);}
.reveal.in{opacity:1;transform:translateY(0);}
@media(prefers-reduced-motion){.reveal{opacity:1;transform:none}}
</style></head><body>
<div class="bg-grid"></div>
<div class="cursor"></div>
<div class="cursor-dot"></div>
<div id="app"></div>
<script>
(function(){
let E=s=>{let d=document.createElement('span');d.textContent=s??"";return d.innerHTML;};
let ytId=u=>{let m=String(u??"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);return m?m[1]:u;};
let thumb=id=>'https://img.youtube.com/vi/'+id+'/hqdefault.jpg';
let nl2p=t=>String(t??"").split(/\n{2,}|\n/).filter(x=>x.trim()).map(p=>'<p>'+E(p)+'</p>').join('');

function sec(id,label,title,desc,body){
  return `<section id="${id}" class="section reveal"><div class="section-inner"><span class="label">${E(label)}</span><h2>${E(title)}</h2>${desc?`<p class="desc">${E(desc)}</p>`:''}${body}</div></section>`;
}

function render(){
  let D=window.SD||{};
  let brand=D.brand||"Seru Digital";
  let hvid=D.heroVideo||"/mascot.mp4";

  let catAssign={};
  (D.videos||[]).forEach((v,i)=>{
    let t=v.title||'';let d=v.desc||'';
    if(/beauty|product|fashion|klinik|iklan|komersil/i.test(t+' '+d))catAssign[i]='Commercial';
    else if(/layanan|masyarakat|paspor|public|ilm/i.test(t+' '+d))catAssign[i]='Public Service';
    else if(/social|met gala|transform/i.test(t+' '+d))catAssign[i]='Social Content';
    else if(/edukasi|sejarah|pendidikan|education|talking/i.test(t+' '+d))catAssign[i]='Educational';
    else catAssign[i]='Commercial';
  });
  let usedCats=[...new Set(Object.values(catAssign))];

  let nav=`<nav class="nav"><div class="nav-inner"><span class="nav-brand">${E(brand)}</span><div class="nav-menu"><a href="#layanan">Layanan</a><a href="#kelas">Kelas</a><a href="#karya">Karya</a><a href="#testimoni">Testimoni</a><a class="nav-cta" href="#kontak">Mulai Project</a></div></div></nav>`;

  let heroBg=`<div class="hero-bg"><video autoplay muted loop playsinline preload="auto" src="${E(hvid)}"></video></div>`;
  let hero=`<section class="hero">${heroBg}<div class="hero-content">
    <span class="hero-chip">${E(D.heroEyebrow||'Kreator & Mentor Video Animasi AI')}</span>
    <h1>${(D.heroTitle||'Mengubah ide jadi cerita visual yang hidup.').replace('cerita visual','<em>cerita visual</em>')}</h1>
    <p class="hero-sub">${E(D.heroText||'Seru Digital membuat video animasi dan konten sinematik berbasis AI, sekaligus mengajarkan orang cara memproduksinya sendiri lewat ekosistem SERU DIGITAL LABS.')}</p>
    <div class="hero-btns"><a class="btn btn-fill" href="#karya">Lihat Karya</a><a class="btn btn-line" href="#kontak">Ajak Kolaborasi</a></div>
  </div></section>`;

  let statsHtml='<div class="stats">'+(D.stats||[]).map(s=>`<div class="stat"><div class="stat-val">${E(s.value)}</div><div class="stat-lbl">${E(s.label)}</div><div class="stat-sub">${E(s.caption)}</div></div>`).join('')+'</div>';
  let statsSec=sec('stats','Seru Digital dalam angka','','',statsHtml);

  let aboutSec=sec('tentang',D.aboutTitle||'Tentang Seru Digital','','','<div class="about-text">'+nl2p(D.aboutText)+'</div>');

  let svcHtml='<div class="svc-grid">'+(D.services||[]).map(s=>`<div class="svc-card"><div class="svc-ico">${E(s.icon)}</div><h3>${E(s.title)}</h3><p>${E(s.desc)}</p></div>`).join('')+'</div>';
  let svcSec=sec('layanan','Layanan','Apa yang bisa saya bantu','Solusi konten video, animasi, dan mentoring AI untuk brand dan kreator.',svcHtml);

  let classHtml='<div class="class-list">'+(D.classItems||[]).map((c,i)=>`<div class="class-item"><div class="class-num">${i+1}</div><div><h3>${E(c.title)}</h3><p>${E(c.desc)}</p></div></div>`).join('')+
    '</div><div class="note-box"><div class="note-ico">🎓</div><div><strong>SERU DIGITAL LABS</strong><p>Ekosistem belajar berisi materi, tools SERA, dan komunitas — membantu kamu menguasai produksi video animasi AI dari nol sampai mahir.</p></div></div>'+
    '<div class="note-cta"><a class="btn btn-fill" href="'+(D.whatsapp||'#kontak')+'" target="_blank">Gabung Sekarang</a></div>';
  let classSec=sec('kelas','Belajar',D.classTitle||'Belajar bareng Seru Digital',D.classText||'',classHtml);

  let filterBar='<div class="filter-bar"><button class="filter-chip active" data-cat="all">Semua</button>';
  usedCats.forEach(c=>{filterBar+=`<button class="filter-chip" data-cat="${E(c)}">${E(c)}</button>`;});
  filterBar+='</div>';

  let vidHtml='<div class="v-grid">'+(D.videos||[]).map((v,i)=>{
    let id=ytId(v.youtube),img=id?thumb(id):'';
    return `<article class="v-card" data-cat="${E(catAssign[i]||'Commercial')}" data-video="${E(v.youtube)}"><div class="v-thumb">${img?`<img src="${E(img)}" alt="${E(v.title)}" loading="lazy">`:''}<div class="v-play"><div class="v-play-ico"></div></div></div><div class="v-body"><div class="v-cat">${E(catAssign[i]||'Commercial')}</div><h3>${E(v.title)}</h3><div class="v-desc">${E(v.desc)}</div></div></article>`;
  }).join('')+'</div>';
  let vidSec=sec('karya','Portfolio','Karya pilihan','Beberapa video yang sudah saya produksi — dari sinematik sampai konten iklan.',filterBar+vidHtml);

  let testiHtml='<div class="testi-grid">'+(D.testimonials||[]).map(t=>`<div class="testi-card"><p class="testi-q">${E(t.quote)}</p><div class="testi-n">${E(t.name)}</div><div class="testi-r">${E(t.meta)}</div></div>`).join('')+'</div>';
  let testiSec=sec('testimoni','Testimoni','Apa kata klien & murid','',testiHtml);

  let ctBtns='<a class="btn btn-fill" href="mailto:'+E(D.email)+'">Email Saya</a>'+
    (D.whatsapp?'<a class="btn btn-line" href="'+E(D.whatsapp)+'" target="_blank">WhatsApp</a>':'')+
    (D.instagram?'<a class="btn btn-line" href="'+E(D.instagram)+'" target="_blank">Instagram</a>':'');
  let contactSec=sec('kontak','Kontak',D.contactTitle||'Ayo kerja bareng',D.contactText||'','<div class="contact-box"><h2>Ayo kerja bareng</h2><p>'+E(D.contactText||'Punya project video, butuh konten, atau ingin belajar? Hubungi Seru Digital.')+'</p><div class="contact-cta">'+ctBtns+'</div></div>');

  let footer=`<footer>${E(brand)} <em>✦</em> SERU DIGITAL LABS <em>✦</em> 2026</footer>`;
  let modal=`<div class="modal" id="videoModal"><button class="modal-x" id="modalClose">&times;</button><div class="modal-vid"><iframe id="modalIframe" src="" allow="autoplay;encrypted-media" allowfullscreen></iframe></div></div>`;

  document.getElementById("app").innerHTML=nav+hero+statsSec+aboutSec+svcSec+classSec+vidSec+testiSec+contactSec+footer+modal;
  init();
}

function init(){
  document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener("click",function(e){
    e.preventDefault();let t=document.querySelector(this.getAttribute("href"));if(t)t.scrollIntoView({behavior:"smooth"});
  }));
  document.querySelector(".filter-bar")?.addEventListener("click",function(e){
    let btn=e.target.closest(".filter-chip");if(!btn)return;
    this.querySelectorAll(".filter-chip").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".v-card").forEach(c=>c.style.display=(btn.dataset.cat==="all"||c.dataset.cat===btn.dataset.cat)?"":"none");
  });
  let modal=document.getElementById("videoModal"),iframe=document.getElementById("modalIframe");
  document.querySelectorAll(".v-card").forEach(c=>c.addEventListener("click",()=>{
    let vid=c.dataset.video,id=ytId(vid);if(!id)return;
    iframe.src="https://www.youtube.com/embed/"+id+"?autoplay=1&rel=0";modal.classList.add("open");document.body.style.overflow="hidden";
  }));
  let close=()=>{modal.classList.remove("open");iframe.src="";document.body.style.overflow="";};
  document.getElementById("modalClose").addEventListener("click",close);
  modal.addEventListener("click",e=>{if(e.target===modal)close()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  let obs=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");obs.unobserve(e.target);}})},{threshold:.06,rootMargin:"0px 0px -16px 0px"});
  document.querySelectorAll(".reveal").forEach(el=>obs.observe(el));
  // Custom cursor
  let cr=document.querySelector(".cursor"),cd=document.querySelector(".cursor-dot");
  document.addEventListener("mousemove",e=>{let x=e.clientX,y=e.clientY;cr.style.left=x+"px";cr.style.top=y+"px";cd.style.left=x+"px";cd.style.top=y+"px";});
  document.querySelectorAll("a,button,.v-card,.filter-chip,.btn").forEach(el=>{
    el.addEventListener("mouseenter",()=>cr.classList.add("hover"));
    el.addEventListener("mouseleave",()=>cr.classList.remove("hover"));
  });
}

window.SD={};
fetch("data/content.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{window.SD=j||{};render();}).catch(()=>render());
})();
</script></body></html>
