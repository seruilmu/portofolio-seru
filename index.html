<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seru Digital</title>
<meta name="description" content="Seru Digital. Studio produksi video animasi & konten sinematik berbasis AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070b;--cream:#f5f0ea;--text:#ededf0;--muted:#8a8a98;--faint:#555562;
  --surface:rgba(255,255,255,.035);--border:rgba(255,255,255,.07);
  --g1:#c4b5fd;--g2:#a78bfa;--g3:#818cf8;
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',var(--font);
  --maxw:1200px;--radius:20px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img,svg{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--g1);color:var(--bg);}

/* Ambient background particles */
.bg-mesh{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.6;}
.bg-mesh div{position:absolute;border-radius:50%;filter:blur(100px);}
.bg-mesh div:nth-child(1){width:600px;height:600px;background:#7c3aed;top:-200px;left:-100px;opacity:.15;animation:drift1 18s ease-in-out infinite;}
.bg-mesh div:nth-child(2){width:400px;height:400px;background:#818cf8;bottom:-100px;right:-50px;opacity:.12;animation:drift2 22s ease-in-out infinite;}
.bg-mesh div:nth-child(3){width:500px;height:500px;background:#a78bfa;top:50%;left:60%;opacity:.08;animation:drift3 20s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.1)}66%{transform:translate(-30px,20px) scale(.95)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-30px) scale(1.08)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,40px) scale(1.05)}}

/* NV */
.nav{position:fixed;top:12px;left:50%;z-index:100;transform:translateX(-50%);
  width:calc(100% - 40px);max-width:720px;
  background:rgba(12,12,18,.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.08);border-radius:100px;padding:8px 12px;
  display:flex;align-items:center;justify-content:space-between;
  transition:all .4s cubic-bezier(.4,0,.2,1);}
.nav.scrolled{border-color:rgba(255,255,255,.15);box-shadow:0 8px 40px rgba(0,0,0,.5);}
.nav-brand{font-family:var(--display);font-weight:700;font-size:15px;padding:6px 16px;letter-spacing:-.01em;}
.nav-links{display:flex;gap:4px;align-items:center;}
.nav-links a{font-size:12px;font-weight:500;padding:8px 16px;border-radius:100px;color:var(--muted);transition:all .25s;}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:rgba(255,255,255,.06);}
.nav-cta{margin-left:4px;padding:10px 20px;border-radius:100px;font-size:11px;font-weight:600;background:var(--text);color:var(--bg);transition:all .25s;letter-spacing:.02em;}
.nav-cta:hover{transform:scale(1.03);box-shadow:0 8px 28px rgba(196,181,253,.25);}
@media(max-width:768px){.nav{width:calc(100% - 20px)}.nav-links a:not(.nav-cta){display:none;}}

/* HERO */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;z-index:1;}
.hero-bg{position:absolute;inset:0;overflow:hidden;}
.hero-bg video,.hero-bg iframe{position:absolute;top:50%;left:50%;width:177.78vh;height:56.25vw;min-width:100%;min-height:100%;transform:translate(-50%,-50%);object-fit:cover;pointer-events:none;border:0;}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 50%,rgba(124,58,237,.15),transparent 60%),
    linear-gradient(180deg,rgba(7,7,11,.15) 0%,rgba(7,7,11,.65) 50%,rgba(7,7,11,.95) 90%);}
.hero-content{position:relative;z-index:2;width:100%;max-width:var(--maxw);margin:0 auto;padding:0 32px;}
.hero-badge{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border:1px solid rgba(255,255,255,.12);border-radius:100px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:32px;
  backdrop-filter:blur(8px);background:rgba(255,255,255,.03);
  animation:fadeUp .8s cubic-bezier(.4,0,.2,1) both;}
.hero-badge .pulse{width:7px;height:7px;border-radius:50%;background:#a78bfa;box-shadow:0 0 12px #a78bfa;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}
.hero h1{font-family:var(--display);font-size:clamp(44px,7.5vw,88px);line-height:.98;font-weight:800;letter-spacing:-.03em;margin-bottom:24px;
  background:linear-gradient(180deg,#fff 0%,rgba(255,255,255,.78) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:fadeUp .8s .1s cubic-bezier(.4,0,.2,1) both;}
.hero h1 .accent{
  background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{font-size:clamp(15px,1.8vw,18px);color:rgba(255,255,255,.55);max-width:48ch;margin-bottom:40px;line-height:1.7;
  animation:fadeUp .8s .2s cubic-bezier(.4,0,.2,1) both;}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;animation:fadeUp .8s .3s cubic-bezier(.4,0,.2,1) both;}
.btn{padding:15px 32px;border-radius:100px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:10px;border:none;transition:all .3s cubic-bezier(.4,0,.2,1);}
.btn-fill{background:var(--text);color:var(--bg);}
.btn-fill:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(196,181,253,.3);}
.btn-outline{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.2);}
.btn-outline:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.04);}
@keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}

/* Side mascot */
.hero-mascot{position:absolute;right:0;bottom:0;z-index:1;width:42%;max-width:480px;pointer-events:none;
  animation:floatMascot 6s ease-in-out infinite;}
@keyframes floatMascot{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.hero-mascot img,.hero-mascot video{width:100%;height:auto;filter:drop-shadow(0 20px 60px rgba(124,58,237,.25));}
@media(max-width:900px){.hero-mascot{opacity:.25;width:70%;right:-10%}}

/* SECTIONS */
.section{position:relative;z-index:1;padding:60px 32px 80px;}
.section-inner{max-width:var(--maxw);margin:0 auto;}
.section-tag{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--g2);margin-bottom:14px;}
.section-tag .dot{width:5px;height:5px;border-radius:50%;background:var(--g2);}
.section h2{font-family:var(--display);font-size:clamp(28px,4.5vw,52px);font-weight:700;letter-spacing:-.02em;line-height:1.06;margin-bottom:14px;}
.section-sub{color:var(--muted);font-size:16px;max-width:48ch;margin-bottom:44px;line-height:1.7;}

/* WORK GRID */
.work-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
@media(max-width:700px){.work-grid{grid-template-columns:1fr;}}
.work-card{position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;
  background:#111115;border:1px solid rgba(255,255,255,.05);
  transition:all .4s cubic-bezier(.4,0,.2,1);}
.work-card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.15);box-shadow:0 20px 60px rgba(0,0,0,.6);}
.work-card:hover .work-play{transform:scale(1.08);opacity:1;}
.work-card:hover .work-thumb img{transform:scale(1.05);}
.work-thumb{aspect-ratio:16/9;position:relative;overflow:hidden;background:#1a1a22;}
.work-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.4,0,.2,1);}
.work-thumb::after{content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(7,7,11,.8) 0%,transparent 30%,transparent 70%,rgba(7,7,11,.1));}
.work-play{position:absolute;inset:0;display:grid;place-items:center;z-index:2;opacity:.5;transition:all .4s;}
.work-play-icon{width:60px;height:60px;border-radius:50%;
  background:rgba(0,0,0,.45);backdrop-filter:blur(10px);
  border:1.5px solid rgba(255,255,255,.25);
  display:grid;place-items:center;
  box-shadow:0 8px 32px rgba(0,0,0,.5);}
.work-play-icon::after{content:"";border-left:16px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:3px;}
.work-info{padding:20px 24px 24px;position:relative;z-index:1;}
.work-cat{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--g2);margin-bottom:6px;}
.work-info h3{font-family:var(--display);font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em;}
.work-year{font-size:12px;color:var(--faint);}

/* MODAL */
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);
  backdrop-filter:blur(12px);align-items:center;justify-content:center;}
.modal.open{display:flex;}
.modal-close{position:absolute;top:28px;right:28px;z-index:201;width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer;
  display:grid;place-items:center;transition:all .2s;}
.modal-close:hover{background:rgba(255,255,255,.1);}
.modal-video{width:min(92vw,1100px);aspect-ratio:16/9;position:relative;}
.modal-video iframe{width:100%;height:100%;border:0;border-radius:16px;}

/* WHY */
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:900px){.why-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.why-grid{grid-template-columns:1fr}}
.why-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 26px;
  position:relative;overflow:hidden;transition:all .35s;}
.why-card:hover{border-color:rgba(196,181,253,.25);transform:translateY(-4px);box-shadow:0 16px 48px rgba(124,58,237,.1);}
.why-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));transform:scaleX(0);transform-origin:left;transition:transform .4s;}
.why-card:hover::before{transform:scaleX(1);}
.why-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.15);margin-bottom:18px;}
.why-card h3{font-family:var(--display);font-size:17px;font-weight:700;margin-bottom:8px;}
.why-card p{color:var(--muted);font-size:14px;line-height:1.6;}

/* LIGHT SECTION */
.section-alt{background:var(--cream);color:#1a1a1e;position:relative;z-index:1;}
.section-alt .section-tag{color:#6d28d9;}
.section-alt .section-tag .dot{background:#6d28d9;}
.section-alt h2{color:#1a1a1e;}
.section-alt .section-sub{color:#555;}

/* CONTACT */
.contact{text-align:center;padding:80px 0;}
.contact h2{font-family:var(--display);font-size:clamp(28px,4.5vw,52px);margin-bottom:16px;}
.contact p{color:var(--muted);margin-bottom:36px;max-width:48ch;margin:0 auto 36px;}
.contact-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}

/* FOOTER */
footer{padding:40px 32px;text-align:center;color:var(--faint);font-size:13px;border-top:1px solid var(--border);
  position:relative;z-index:1;}
footer span{color:var(--g2);}

/* SCROLL REVEAL */
.reveal{opacity:0;transform:translateY(40px);
  transition:opacity .8s cubic-bezier(.3,0,.1,1),transform .8s cubic-bezier(.3,0,.1,1);}
.reveal.in{opacity:1;transform:translateY(0);}
@media(prefers-reduced-motion){.reveal{opacity:1;transform:none}}
</style></head><body>

<div class="bg-mesh"><div></div><div></div><div></div></div>

<div id="app"></div>

<script>
(function(){
let D={
  brand:"Seru Digital",
  heroBadge:"AI VIDEO PRODUCTION",
  heroTitle:'Mengubah ide jadi <span class="accent">cerita visual</span> yang hidup.',
  heroText:"Studio produksi video animasi dan konten sinematik berbasis AI. Konsep, produksi, dan post dalam satu pipeline kreatif.",
  heroVideo:"/mascot.mp4",
  whyTitle:"Dibangun di atas tiga pilar",
  whyText:"Kami percaya produksi modern bukan soal tools, tapi soal keahlian, kecepatan, dan hasil akhir.",
  whyItems:[
    {i:"🎯",t:"Kualitas Visual Premium",d:"Setiap frame diproses dengan standar sinematik. Hasil setara studio produksi."},
    {i:"⚡",t:"Pipeline AI Cepat & Efisien",d:"Workflow AI terkini memotong waktu produksi tanpa mengorbankan kualitas."},
    {i:"🤝",t:"Kolaborasi Transparan",d:"Update rutin, revisi jelas, komunikasi tanpa drama. Kamu tahu progress setiap saat."},
    {i:"🎓",t:"Edukasi & Mentoring",d:"Bukan cuma produksi, kami juga mengajarkan prosesnya lewat SERU DIGITAL LABS."},
    {i:"🔧",t:"Tools SERA Ecosystem",d:"SERA Cinema, Storyboard, Karaktersheet, tools internal yang bikin workflow mulus."},
    {i:"🌐",t:"Komunitas & Support",d:"Akses komunitas kreator AI yang aktif berbagi ilmu dan update tools terbaru."}
  ],
  videos:[
    {t:"SUNSHIELD",c:"Commercial",d:"Beauty clinic product video",y:"pjTFAE8wPis",yr:"2025"},
    {t:"M PASPOR",c:"Public Service",d:"ILM content for M Paspor",y:"HqrmwXNvFqo",yr:"2025"},
    {t:"EMS SCULPTING",c:"Commercial",d:"Treatment technology showcase",y:"3fR06DUR6rc",yr:"2025"},
    {t:"Met Gala",c:"Social Content",d:"Singapore client project",y:"qcgmXhwPgz4",yr:"2025"},
    {t:"Transformasi",c:"Social Content",d:"AI animation transformation",y:"ZsJL9f9Zc9s",yr:"2024"},
    {t:"Sejarah",c:"Educational",d:"Cinematic history content",y:"WbqSByOgOyY",yr:"2025"},
    {t:"GAMIS BONO",c:"Commercial",d:"Fashion product video",y:"_Yx_mJkfT2c",yr:"2025"},
    {t:"Talking Character",c:"Educational",d:"Character education content",y:"IHA5FdGnPmQ",yr:"2025"}
  ],
  contactTitle:"Mulai project bareng",
  contactText:"Punya ide cerita, butuh konten, atau ingin belajar produksi video animasi AI?",
  email:"seru.ilmu@gmail.com",whatsapp:"https://wa.me/6285757305799",
  instagram:"https://instagram.com/seru.digital"
};

function ytId(u){let m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);return m?m[1]:u;}
function thumb(id){return 'https://img.youtube.com/vi/'+id+'/hqdefault.jpg';}
let E=(s)=>{let d=document.createElement('span');d.textContent=s||'';return d.innerHTML;};

function render(){
  let nav=`<nav class="nav" id="topNav"><span class="nav-brand">${E(D.brand)}</span><div class="nav-links"><a href="#karya">Karya</a><a href="#kenapa">Kenapa</a><a href="#layanan">Layanan</a><a class="nav-cta" href="#kontak">Mulai Project</a></div></nav>`;

  let heroBg='';
  let hvid=D.heroVideo||'';
  if(/\.(mp4|webm|ogg)(\?|$)/i.test(hvid)){
    heroBg='<div class="hero-bg"><video autoplay muted loop playsinline preload="auto" src="'+E(hvid)+'"></video></div>';
  }else{
    let id=ytId(hvid);if(id)heroBg='<div class="hero-bg"><iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&loop=1&playlist='+id+'&controls=0&showinfo=0&modestbranding=1&rel=0&playsinline=1" allow="autoplay;encrypted-media" allowfullscreen></iframe></div>';
  }

  let hero=`<section class="hero">${heroBg}<div class="hero-content">
    <span class="hero-badge"><span class="pulse"></span>${E(D.heroBadge)}</span>
    <h1>${D.heroTitle}</h1>
    <p class="hero-sub">${E(D.heroText)}</p>
    <div class="hero-btns">
      <a class="btn btn-fill" href="#karya">Lihat Portfolio</a>
      <a class="btn btn-outline" href="#kontak">Konsultasi Gratis</a>
    </div>
  </div>
  <div class="hero-mascot"><video autoplay muted loop playsinline preload="auto" src="/mascot.mp4"></video></div></section>`;

  let work=`<section id="karya" class="section reveal"><div class="section-inner">
    <span class="section-tag"><span class="dot"></span>Portfolio</span>
    <h2>Karya pilihan</h2>
    <p class="section-sub">Beberapa video yang sudah kami produksi. Dari commercial sampai cinematic storytelling.</p>
    <div class="work-grid">${D.videos.map((v,i)=>{
      let id=ytId(v.y),img=id?thumb(id):'';
      return `<article class="work-card" data-video="${E(v.y)}" style="animation-delay:${i*.06}s">
        <div class="work-thumb">${img?`<img src="${E(img)}" alt="${E(v.t)}" loading="lazy">`:''}
        <div class="work-play"><div class="work-play-icon"></div></div></div>
        <div class="work-info"><div class="work-cat">${E(v.c)}</div><h3>${E(v.t)}</h3><div class="work-year">${E(v.yr)}</div></div></article>`}).join('')}
    </div></div></section>`;

  let why=`<section id="kenapa" class="section section-alt reveal"><div class="section-inner">
    <span class="section-tag"><span class="dot"></span>Kenapa Seru Digital</span>
    <h2>${D.whyTitle}</h2>
    <p class="section-sub">${E(D.whyText)}</p>
    <div class="why-grid">${D.whyItems.map(w=>`<div class="why-card"><div class="why-icon">${E(w.i)}</div><h3>${E(w.t)}</h3><p>${E(w.d)}</p></div>`).join('')}</div>
  </div></section>`;

  let contact=`<section id="kontak" class="section reveal"><div class="section-inner">
    <span class="section-tag"><span class="dot"></span>Kontak</span>
    <div class="contact"><h2>${D.contactTitle}</h2><p>${E(D.contactText)}</p>
    <div class="contact-btns">
      <a class="btn btn-fill" href="mailto:${E(D.email)}">Kirim Email</a>
      <a class="btn btn-outline" href="${E(D.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn btn-outline" href="${E(D.instagram)}" target="_blank" rel="noopener">Instagram</a>
    </div></div></div></section>`;

  let footer=`<footer>${E(D.brand)} <span>✦</span> SERU DIGITAL LABS <span>✦</span> 2026</footer>`;

  let modal=`<div class="modal" id="videoModal"><button class="modal-close" id="modalClose">&times;</button><div class="modal-video"><iframe id="modalIframe" src="" allow="autoplay;encrypted-media" allowfullscreen></iframe></div></div>`;

  document.getElementById("app").innerHTML=nav+hero+work+why+contact+footer+modal;
  initScroll();
  initModal();
  initReveal();
}

function initScroll(){
  window.addEventListener("scroll",()=>{
    document.getElementById("topNav").classList.toggle("scrolled",window.scrollY>60);
  });
  document.querySelectorAll('a[href^="#"]').forEach(a=>{a.addEventListener("click",function(e){
    e.preventDefault();let t=document.querySelector(this.getAttribute("href"));if(t)t.scrollIntoView({behavior:"smooth"});
  })});
}

function initModal(){
  let modal=document.getElementById("videoModal"), iframe=document.getElementById("modalIframe");
  document.querySelectorAll(".work-card").forEach(card=>{
    card.addEventListener("click",()=>{
      let vid=card.dataset.video,id=ytId(vid);if(!id)return;
      iframe.src="https://www.youtube.com/embed/"+id+"?autoplay=1&rel=0";
      modal.classList.add("open");document.body.style.overflow="hidden";
    });
  });
  document.getElementById("modalClose").addEventListener("click",closeModal);
  modal.addEventListener("click",e=>{if(e.target===modal)closeModal();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
  function closeModal(){modal.classList.remove("open");iframe.src="";document.body.style.overflow="";}
}

function initReveal(){
  let obs=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");obs.unobserve(e.target);}})},{threshold:.12,rootMargin:"0px 0px -40px 0px"});
  document.querySelectorAll(".reveal").forEach(el=>obs.observe(el));
}

render();
})();
</script></body></html>
